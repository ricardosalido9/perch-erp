<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grupo CFA — Control de Pendientes</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap');
  :root {
    /* Paleta Grupo CFA (tomada del logo) */
    --ink:#1c1733; --slate:#5d5878; --muted:#928da8;
    --paper:#f5f4f9; --surface:#ffffff; --line:#e6e3ef;
    --primary:#3d2e75; --primary-600:#4d3b90;
    --accent:#3d2e75; --accent-soft:#eceaf6; --accent-ink:#3d2e75;
    --success:#12805c; --success-bg:#e7f5ef;
    --danger:#c2333d; --danger-bg:#fbecec;
    --radius:12px;
    --shadow-sm:0 1px 2px rgba(20,25,35,.05), 0 1px 3px rgba(20,25,35,.05);
    --shadow:0 4px 14px rgba(20,25,35,.06), 0 12px 32px rgba(20,25,35,.06);
    --rail:#282253; --rail-line:#3a3268; --rail-hover:#332b5f; --rail-active:#3d3470;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--paper); color:var(--ink);
    font-family:'Jost',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; letter-spacing:-0.006em; }

  #loginView { min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; color:var(--ink); padding:24px;
    background:radial-gradient(1100px 620px at 50% -12%, #ffffff 0%, var(--paper) 55%, #e9e6f4 100%); }
  #loginView img.logo { width:180px; max-width:52vw; margin-bottom:30px; }
  .login-card { width:100%; max-width:360px; background:var(--surface); color:var(--ink);
    border:1px solid var(--line); box-shadow:var(--shadow); border-radius:14px; padding:26px 24px; }
  .login-card h1 { margin:0 0 18px; font-size:16px; font-weight:600; }
  .login-card .fld { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .login-card label { font-size:13px; color:var(--slate); font-weight:600; }
  .login-card input { font:inherit; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .login-card input:focus { outline:2px solid var(--ink); outline-offset:1px; border-color:var(--ink); }
  .pass-wrap { position:relative; display:flex; }
  .pass-wrap input { flex:1 1 auto; padding-right:42px; }
  .pass-toggle { position:absolute; right:6px; top:50%; transform:translateY(-50%);
    background:transparent; border:0; padding:6px; cursor:pointer; color:var(--muted);
    display:flex; align-items:center; }
  .pass-toggle:hover { color:var(--ink); border-color:transparent; }
  .pass-toggle svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .login-err { color:var(--danger); font-size:13px; min-height:18px; margin:2px 0 10px; }
  .btn-full { width:100%; justify-content:center; }

  #appView { display:none; }
  #appView.on { display:block; }

  .sidebar { position:fixed; top:0; left:0; bottom:0; width:252px; z-index:60;
    background:var(--surface); color:var(--ink); border-right:1px solid var(--line);
    display:flex; flex-direction:column; overflow-y:auto;
    transform:translateX(-100%); transition:transform .22s ease; }
  #appView.nav-open .sidebar { transform:translateX(0); }
  .backdrop { position:fixed; inset:0; background:rgba(20,25,35,.35); z-index:55;
    opacity:0; visibility:hidden; transition:opacity .2s; }
  #appView.nav-open .backdrop { opacity:1; visibility:visible; }

  .sidebar .brand { display:flex; align-items:flex-start; gap:11px; padding:22px 18px 18px;
    border-bottom:1px solid var(--line); }
  .sidebar .brand-txt { display:flex; flex-direction:column; gap:3px; }
  .sidebar .brand .bw { font-size:19px; font-weight:600; letter-spacing:6px; text-transform:uppercase;
    color:var(--primary); line-height:1; }
  .sidebar .brand .tag { font-size:9.5px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); }
  .sidebar .brand .close { margin-left:auto; background:transparent; border:0; color:var(--muted);
    cursor:pointer; padding:4px; display:flex; }
  .sidebar .brand .close svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; }
  .sidebar .nav-title { font-size:10px; letter-spacing:2px; text-transform:uppercase;
    color:var(--muted); padding:18px 20px 8px; }
  .sidebar nav { padding-bottom:8px; }

  .nav-item { display:flex; align-items:center; gap:12px; width:auto; text-align:left;
    background:transparent; border:0; border-radius:10px; margin:2px 12px; box-sizing:border-box;
    padding:10px 12px; font-size:14px; font-weight:500; color:var(--slate); cursor:pointer;
    font-family:inherit; letter-spacing:-0.006em; }
  .nav-item:hover { background:var(--paper); color:var(--ink); }
  .nav-item.active { background:var(--accent-soft); color:var(--accent-ink); font-weight:600; }
  .nav-item svg { width:19px; height:19px; flex:0 0 19px; fill:none;
    stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .nav-label { flex:1 1 auto; }
  .nav-item .chev { width:15px; height:15px; flex:0 0 15px; color:var(--muted); transition:transform .15s; }
  .nav-group.open .nav-grouphead .chev { transform:rotate(90deg); }
  .nav-group.open .nav-grouphead { color:var(--ink); }
  .nav-sub { display:none; }
  .nav-group.open .nav-sub { display:block; }
  .nav-child { padding-left:43px; }
  .nav-child.active { background:var(--accent-soft); color:var(--accent-ink); }
  .nav-sub .nav-sub .nav-item { padding-left:58px; font-size:13px; }

  .rail-foot { margin-top:auto; border-top:1px solid var(--line); padding:10px 12px; }
  .rail-logout { display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:transparent; border:0; border-radius:10px; padding:10px 12px; cursor:pointer;
    font:inherit; font-size:14px; font-weight:500; color:var(--slate); letter-spacing:-0.006em; }
  .rail-logout:hover { background:var(--paper); color:var(--danger); }
  .rail-logout svg { width:19px; height:19px; flex:0 0 19px; fill:none;
    stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }

  /* Escritorio: sidebar fija, contenido desplazado, sin hamburguesa */
  @media (min-width:900px) {
    .sidebar { transform:none; }
    .sidebar .brand .close { display:none; }
    .main { margin-left:252px; }
    .hamburger { display:none; }
    .backdrop { display:none; }
  }

  .main { min-height:100vh; display:flex; flex-direction:column; }
  .topbar { background:transparent; padding:18px 24px; display:flex; align-items:center; gap:13px; }
  .hamburger { display:flex; align-items:center; justify-content:center; background:var(--surface);
    border:1px solid var(--line); border-radius:8px; width:38px; height:38px; padding:0; cursor:pointer; color:var(--ink); }
  .hamburger:hover { border-color:var(--muted); }
  .hamburger svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; }
  .topbar .userbox { margin-left:auto; display:flex; align-items:center; gap:11px; }
  .topbar .user-avatar { width:34px; height:34px; border-radius:50%; background:var(--accent-soft);
    color:var(--accent-ink); display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:600; text-transform:uppercase; flex:0 0 34px; }
  .topbar .hello { font-size:14px; color:var(--ink); font-weight:500; }
  .topbar .logout { background:var(--surface); color:var(--slate); border:1px solid var(--line);
    padding:7px 13px; border-radius:9px; font:inherit; font-size:13px; font-weight:500; cursor:pointer; }
  .topbar .logout:hover { border-color:var(--muted); color:var(--ink); }

  .content { padding:8px 24px 28px; width:100%; }

  .page-head { margin-bottom:8px; }
  .ph-row { display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:16px; }
  .ph-title { margin:0; font-size:42px; font-weight:600; letter-spacing:-0.5px; color:var(--ink); line-height:1.05; }
  .ph-sub { margin:6px 0 0; font-size:14px; color:var(--muted); }
  .ph-actions { display:flex; align-items:center; gap:10px; flex-shrink:0; padding-top:6px; }
  .btn-primary { display:inline-flex; align-items:center; gap:7px; background:var(--primary); color:#fff;
    border:0; border-radius:10px; padding:11px 18px; font:inherit; font-size:14px; font-weight:500;
    cursor:pointer; letter-spacing:-0.006em; }
  .btn-primary:hover { background:var(--primary-600); }
  .btn-primary svg { stroke:currentColor; }

  /* Modal de agregar registro */
  .modal-overlay { position:fixed; inset:0; z-index:80; background:rgba(20,25,35,.45);
    display:none; align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--surface); border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); width:100%; max-width:900px; margin:auto;
    display:flex; flex-direction:column; max-height:calc(100vh - 80px); }
  .modal-head { display:flex; align-items:center; justify-content:space-between;
    padding:18px 22px; border-bottom:1px solid var(--line); font-size:17px; font-weight:600; color:var(--ink); }
  .modal-x { background:transparent; border:0; color:var(--muted); cursor:pointer; padding:4px; display:flex; border-radius:8px; }
  .modal-x:hover { background:var(--paper); color:var(--ink); }
  .modal-x svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; }
  .modal-body { padding:22px; overflow-y:auto; }
  .modal-foot { display:flex; justify-content:flex-end; gap:10px; padding:16px 22px;
    border-top:1px solid var(--line); }

  @media (max-width:640px) {
    .ph-title { font-size:32px; }
    .modal-overlay { padding:16px; }
  }

  @media (max-width:520px) {
    .sidebar { width:82vw; max-width:290px; }
    .content { padding:16px; }
    .topbar { padding:12px 14px; }
    .topbar .hello { display:none; }
  }

  .controls { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin:22px 0 14px; }

  /* --- Filtros --- */
  .filterbar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:10px; position:relative; }
  .chip { display:inline-flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--line);
    border-radius:999px; padding:5px 10px 5px 12px; font-size:13px; color:var(--ink); }
  .chip b { font-weight:600; }
  .chip .x { cursor:pointer; color:var(--muted); font-weight:700; line-height:1; padding:0 2px; }
  .chip .x:hover { color:var(--danger); }
  .nofilters { font-size:13px; color:var(--muted); }
  .dl-menu { position:absolute; top:100%; left:0; z-index:50; margin-top:6px; min-width:180px;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    box-shadow:0 8px 28px rgba(20,25,40,.12); padding:6px; display:flex; flex-direction:column; gap:2px; }
  .dl-menu button { width:100%; text-align:left; border:none; background:transparent; padding:9px 10px;
    border-radius:7px; font:inherit; font-size:13px; cursor:pointer; color:var(--ink); }
  .dl-menu button:hover { background:var(--paper); }

  .filter-pop { position:absolute; top:100%; left:0; z-index:40; margin-top:6px; width:340px; max-width:92vw;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    box-shadow:0 8px 28px rgba(20,25,40,.12); padding:14px; box-sizing:border-box; }
  .filter-pop h4 { margin:0 0 8px; font-size:13px; color:var(--slate); font-weight:600; }
  .filter-pop select, .filter-pop input { width:100%; font:inherit; border:1px solid var(--line);
    border-radius:8px; padding:7px 9px; margin-bottom:8px; box-sizing:border-box; }
  .filter-values { max-height:200px; overflow-y:auto; border:1px solid var(--line); border-radius:8px; padding:4px; margin-bottom:10px; }
  .filter-values label { display:flex; align-items:flex-start; gap:8px; font-size:13px; line-height:1.35;
    padding:6px 8px; cursor:pointer; border-radius:6px; text-align:left; }
  .filter-values label:hover { background:var(--paper); }
  .filter-values input[type=checkbox] { flex:0 0 auto; width:15px; height:15px; margin:1px 0 0; }
  .filter-values label span { flex:1 1 auto; min-width:0; word-break:break-word; }
  .fv-tools { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .fv-tools input { margin-bottom:0; }
  .fv-tools button { padding:6px 10px; font-size:12px; white-space:nowrap; }
  .fv-empty { font-size:13px; color:var(--muted); padding:8px; }
  .filter-range { display:flex; align-items:center; gap:6px; margin-bottom:10px; }
  .filter-range input { margin-bottom:0; min-width:0; flex:1 1 0; }
  .filter-range span { flex:0 0 auto; color:var(--muted); }
  .filter-actions { display:flex; gap:8px; justify-content:flex-end; }
  .filter-actions button { padding:6px 12px; font-size:13px; }

  /* --- Tarjetas de resumen --- */
  .summary { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:16px; }
  .sum-card { background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:12px 16px; min-width:150px; text-align:center; }
  .sum-card .k { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
  .sum-card .v { font-size:20px; font-weight:600; letter-spacing:-0.4px; margin-top:2px; font-variant-numeric:tabular-nums; }

  /* ---------- Inicio ---------- */
  #homeView { display:none; }
  .hero { margin-bottom:26px; }
  .hero h2 { margin:0; font-size:26px; font-weight:600; letter-spacing:-0.6px; }
  .hero p { margin:4px 0 0; color:var(--muted); font-size:14px; }

  .quick-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:28px; }
  .quick-card { display:flex; align-items:center; gap:12px; background:var(--surface);
    border:1px solid var(--line); border-radius:12px; padding:16px; cursor:pointer; text-align:left;
    font:inherit; color:var(--ink); transition:border-color .12s, transform .12s; }
  .quick-card:hover { border-color:#c8ccd2; transform:translateY(-1px); }
  .quick-card svg { width:22px; height:22px; flex:0 0 22px; fill:none; stroke:currentColor;
    stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; color:var(--slate); }
  .quick-card .qt { font-size:14px; font-weight:600; }
  .quick-card .qs { font-size:12px; color:var(--muted); margin-top:1px; }

  .alert-list { display:flex; flex-direction:column; gap:10px; }
  .alert { display:flex; align-items:center; gap:14px; background:var(--surface);
    border:1px solid var(--line); border-left:3px solid var(--muted); border-radius:10px; padding:14px 16px; }
  .alert.warn { border-left-color:#d99a2b; }
  .alert.info { border-left-color:var(--slate); }
  .alert .an { font-size:22px; font-weight:600; min-width:52px; font-variant-numeric:tabular-nums; }
  .alert .ab { flex:1 1 auto; min-width:0; }
  .alert .at { font-size:14px; font-weight:600; }
  .alert .ad { font-size:13px; color:var(--muted); margin-top:1px; }
  .alert button { padding:6px 12px; font-size:13px; white-space:nowrap; }
  .all-good { background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:22px; text-align:center; color:var(--muted); font-size:14px; }

  /* ---------- Dashboard ---------- */
  #dashView { display:none; }
  .dash-bar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:22px; }
  .dash-bar .lb { font-size:13px; color:var(--slate); font-weight:600; }
  .dash-bar input[type=date] { font:inherit; border:1px solid var(--line); border-radius:8px;
    padding:7px 9px; background:var(--surface); color:var(--ink); }
  .dash-bar input:focus { outline:2px solid var(--ink); outline-offset:1px; border-color:var(--ink); }
  .dash-bar .quick { display:flex; gap:6px; margin-left:auto; flex-wrap:wrap; }
  .dash-bar .quick button { padding:6px 11px; font-size:13px; }
  .dash-bar .quick button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .dash-section { margin-bottom:28px; }
  .dash-section > h3 { margin:0 0 12px; font-size:13px; font-weight:600; color:var(--slate);
    text-transform:uppercase; letter-spacing:1px; }
  .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  .kpi { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; min-width:0; }
  .kpi .k { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
  .kpi .v { font-size:24px; font-weight:600; letter-spacing:-0.6px; margin-top:4px;
    font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .kpi .s { font-size:12px; color:var(--muted); margin-top:2px; }

  /* Filtro de fechas del dashboard */
  .dash-filter { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:22px; }
  .dash-filter label { font-size:13px; font-weight:600; color:var(--slate); }
  .dash-filter input[type=date] { font:inherit; border:1px solid var(--line); border-radius:8px;
    padding:7px 10px; background:var(--surface); color:var(--ink); }
  .dash-filter input:focus { outline:2px solid var(--ink); outline-offset:1px; border-color:var(--ink); }
  .dash-filter span { color:var(--muted); }
  .dash-filter button { padding:7px 14px; font-size:13px; }
  .dash-filter .dash-hint { font-size:12px; color:var(--muted); margin-left:4px; }
  .kpi.dark { background:var(--rail); border-color:var(--rail); }
  .kpi.dark .k { color:#8b929b; }
  .kpi.dark .v { color:#fff; }
  .kpi.dark .s { color:#8b929b; }

  .dash-cols { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:18px; }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .panel > h4 { margin:0; padding:14px 16px; border-bottom:1px solid var(--line);
    font-size:14px; font-weight:600; }
  .panel-body { padding:16px; }

  /* Barras horizontales */
  .bars { display:flex; flex-direction:column; gap:10px; }
  .bar-row { display:grid; grid-template-columns:130px 1fr auto; align-items:center; gap:10px; font-size:13px; }
  .bar-row .lbl { color:var(--slate); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track { background:var(--paper); border-radius:999px; height:9px; overflow:hidden; display:block; width:100%; }
  .bar-fill { background:var(--ink); height:9px; border-radius:999px; display:block; }
  .bar-row .val { color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; min-width:64px; text-align:right; }

  /* Columnas verticales (serie mensual) */
  .chart { display:flex; align-items:flex-end; gap:6px; height:170px; padding-top:8px; }
  .chart .cbar { flex:1 1 0; display:flex; flex-direction:column; justify-content:flex-end;
    align-items:center; gap:6px; min-width:0; }
  .chart .cbar .fill { width:100%; background:var(--ink); border-radius:5px 5px 0 0; min-height:2px; }
  .chart .cbar .cl { font-size:10px; color:var(--muted); white-space:nowrap; }
  .chart .cbar .cv { font-size:9px; color:var(--slate); font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .bar-total { display:flex; justify-content:space-between; align-items:center; gap:10px;
    border-top:1px solid var(--line); margin-top:12px; padding-top:10px;
    font-size:13px; font-weight:600; }
  .bar-total .tv { font-variant-numeric:tabular-nums; }
  .chart .cbar:hover .fill { background:#3c424a; }

  .mini-table { width:100%; border-collapse:collapse; font-size:13px; table-layout:auto; }
  .mini-table th, .mini-table td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px; width:auto; }
  .mini-table th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase;
    letter-spacing:.5px; background:transparent; position:static; text-align:left; }
  .mini-table td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .dash-empty { color:var(--muted); font-size:13px; padding:8px 0; }
  input[type=text], input[type=search] { font:inherit; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  input:focus { outline:2px solid var(--ink); outline-offset:1px; border-color:var(--ink); }
  .count { margin-left:auto; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }

  button { font:inherit; font-weight:600; cursor:pointer; border-radius:8px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:8px 14px; transition:background .12s, border-color .12s; }
  button:hover { border-color:#cfd4db; }
  button.primary { background:var(--primary); border-color:var(--primary); color:#fff; }
  button.primary:hover { background:var(--primary-600); border-color:var(--primary-600); }
  button:disabled { opacity:.55; cursor:default; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  .card + .card { margin-top:22px; }

  /* Etiquetas de color para valores de desplegable */

    font-weight:500; line-height:1.5; white-space:nowrap; letter-spacing:0; }

  .chip-b { background:#e6eef2; color:#2f5d74; }   /* azul */
  .chip-c { background:#ece9f2; color:#514a70; }   /* lavanda */
  .chip-d { background:#e7f0ea; color:#2f6b4e; }   /* verde */
  .chip-e { background:#f2e9e6; color:#7a4a3a; }   /* terracota */
  .chip-f { background:#eceae4; color:#5f5a4f; }   /* neutro */

  .row-input { font:inherit; width:100%; min-width:110px; border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  .edit-btn, .save-btn, .cancel-btn { padding:5px 10px; font-size:13px; }

  .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; }
  .form-grid .fld { display:flex; flex-direction:column; gap:5px; }
  .form-grid label { font-size:13px; color:var(--slate); font-weight:600; }
  .form-grid input, .form-grid select { font:inherit; border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--surface); color:var(--ink); width:100%; }
  .form-grid input:focus, .form-grid select:focus { outline:2px solid var(--ink); outline-offset:1px; border-color:var(--ink); }
  .form-grid input[readonly] { background:#e9ebee; color:#4a5057; border-color:#d7dade; cursor:default; }
  .form-grid input[readonly]:focus { outline:none; border-color:#d7dade; }
  .form-actions { margin-top:16px; display:flex; gap:10px; align-items:center; }

  .state { padding:28px 16px; text-align:center; color:var(--muted); font-size:14px; }

  .toast { position:fixed; right:20px; bottom:20px; max-width:340px;
    padding:12px 16px; border-radius:8px; font-size:14px; font-weight:500;
    box-shadow:0 6px 24px rgba(20,25,40,.14); opacity:0; transform:translateY(8px);
    transition:opacity .18s, transform .18s; pointer-events:none; z-index:70; }
  .toast.show { opacity:1; transform:translateY(0); }

  /* ---------- Grupo CFA ---------- */

    background:var(--surface); color:var(--ink); max-width:200px; }

    margin:16px 0 8px; }
  .tl-row { display:grid; grid-template-columns:1fr 110px 32px; gap:8px; margin-bottom:8px; align-items:center; }
  .tl-row input { font:inherit; font-size:14px; border:1px solid var(--line); border-radius:8px; padding:9px 10px; background:var(--surface); color:var(--ink); }
  .tl-row input:focus { outline:2px solid var(--primary); outline-offset:1px; border-color:var(--primary); }
  .tl-del { border:1px solid var(--line); background:var(--surface); border-radius:8px; height:36px; cursor:pointer; color:var(--danger); font-size:14px; }

  .bit-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }

    border:1px solid var(--primary); border-radius:999px; padding:6px 8px 6px 14px; font-size:13px; font-weight:600; }

    font-size:20px; line-height:1; color:var(--ink); cursor:pointer; }

    font:inherit; font-size:13px; cursor:pointer; color:var(--ink); }

  .cal-legend { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:10px; font-size:12px; color:var(--muted); }

  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }

    letter-spacing:.5px; padding:4px 0; }
  .cal-cell { min-height:96px; border:1px solid var(--line); border-radius:10px; padding:6px; background:var(--surface);

  .cal-cell.sel { border-color:var(--primary); box-shadow:0 0 0 2px var(--accent-soft),0 2px 10px rgba(61,46,117,.15); }
  .cal-d { display:flex; align-items:center; justify-content:space-between; font-size:12px; font-weight:600; color:var(--ink); }

  .cal-ev { font-size:10.5px; line-height:1.25; padding:2px 5px; border-radius:5px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; border-left:3px solid transparent; }
  .cal-ev.ev-venc, .cal-legend i.ev-venc, .cal-dot.ev-venc { background:#fdecec; border-color:var(--danger); color:#a12; }
  .cal-ev.ev-hoy,  .cal-legend i.ev-hoy,  .cal-dot.ev-hoy  { background:#fff4e2; border-color:#d98a12; color:#7a4a00; }

  .cal-ev.ev-done, .cal-legend i.ev-done, .cal-dot.ev-done { background:#e9f6ec; border-color:#2e9e4f; color:#1c6b34; }
  .cal-legend i { border-left:none; }

  @media (max-width:720px){ .cal-cell{ min-height:70px; } .cal-ev{ display:none; } .cal-cell.con .cal-n{ display:inline-block; } }
  .multi-chk { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:4px 10px;
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; max-height:150px; overflow-y:auto; }

<script>
  var ICONS = {
    home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
    grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
    cart:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>',
    factory:'<path d="M2 20h20"/><path d="M4 20V10l5 3V10l5 3V7l5 3v10"/>',
    box:'<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3.3 7L12 12l8.7-5"/><path d="M12 22V12"/>',
    tag:'<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>',
    dollar:'<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
    book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
    card:'<rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/>',
    users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    briefcase:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
    check:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
    flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/>',
    clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>'
  };
  function icon(name){ return '<svg viewBox="0 0 24 24">' + (ICONS[name]||'') + '</svg>'; }
  function chev(){ return '<svg class="chev" viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>'; }

  // Llama a una función serverless en /api/*
  async function api(path, body) {
    const res = await fetch('/api/' + path, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    });
    const data = await res.json().catch(function(){ return {}; });
    if (!res.ok) throw new Error(data.error || ('Error ' + res.status));
    return data;
  }

  var state = { token:null, key:null, label:'', headers:[], rows:[], idsUsados:[], categories:{}, lookup:null, rol:'', nombre:'', esAdmin:false, verComo:'', colaboradores:[], editRow:null };

  // Áreas de solo consulta: sin formulario "Agregar registro"
  var READ_ONLY_AREAS = [];
  function esLector() {
    return state.rol === 'lector' || state.rol === 'viewer' || state.rol === 'lectura';
  }
  function esSoloLectura(key) { return esLector() || READ_ONLY_AREAS.indexOf(key) !== -1; }
  var appEl = function(){ return document.getElementById('appView'); };
  function closeNav(){ appEl().classList.remove('nav-open'); }
  function toggleNav(){ appEl().classList.toggle('nav-open'); }

  function toast(msg, kind) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast show ' + (kind || 'ok');
    setTimeout(function () { t.className = 'toast ' + (kind || 'ok'); }, 3200);
  }
  function esc(v) { return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function isDateCol(h) { var s = String(h).toLowerCase();
    return s.indexOf('fecha') !== -1 || s.indexOf('vencimiento') !== -1; }

  function doLogin() {
    var u = document.getElementById('user').value.trim();
    var p = document.getElementById('pass').value;
    var err = document.getElementById('loginErr'); err.textContent = '';
    if (!u || !p) { err.textContent = 'Completá usuario y contraseña.'; return; }
    var btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'Entrando...';
    api('login', { usuario:u, contrasena:p }).then(function (res) {
      if (res && res.ok) {
        state.token = res.token;
        state.rol = String(res.rol || '').trim().toLowerCase();
        state.nombre = res.nombre || u;
        document.getElementById('hello').textContent = 'Hola, ' + primerNombre(res.nombre || u);
        var ini = String(res.nombre || u || '?').trim().charAt(0);
        document.getElementById('userAvatar').textContent = ini || '?';
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('pass').value = '';
        appEl().classList.add('on');
        buildMenu();
      } else { err.textContent = (res && res.error) || 'No se pudo iniciar sesión.'; }
    }).catch(function (e) { err.textContent = (e && e.message) || 'Error de conexión.'; })
      .then(function () { btn.disabled = false; btn.textContent = 'Entrar'; });
  }

  function doLogout() {
    state.token = null; closeNav();
    appEl().classList.remove('on');
    document.getElementById('loginView').style.display = 'flex';
    document.getElementById('user').value = '';
    document.getElementById('user').focus();
  }

  function construirVerComo() {
    var box = document.getElementById('verComoBox');
    if (!box) return;
    if (!state.esAdmin) { box.style.display = 'none'; return; }
    box.style.display = 'flex';
    var opts = '<option value="__todos__">Todos</option>';
    var yo = state.nombre;
    opts += '<option value="' + esc(yo) + '">' + esc(primerNombre(yo)) + ' (yo)</option>';
    (state.colaboradores || []).forEach(function (n) {
      if (norm(n) === norm(yo)) return;
      opts += '<option value="' + esc(n) + '">' + esc(primerNombre(n)) + '</option>';
    });
    var sel = document.getElementById('verComoSel');
    sel.innerHTML = opts;
    sel.value = state.verComo || yo;
    sel.onchange = function () {
      state.verComo = sel.value;
      var esEspecial = (state.key === 'inicio' || state.key === 'dashboard');
      if (state.key === 'inicio') loadHome();
      else if (state.key === 'dashboard') loadDashboard();
      else if (state.key === 'bitacora') loadBitacora();
      else loadArea();
    };
  }
  function buildMenu() {
    api('menu', { token: state.token }).then(function (res) {
      var nav = document.getElementById('navMenu'); nav.innerHTML = '';

      // Construye el menú a cualquier profundidad.
      // Un ítem puede ser área (clickeable) y grupo (desplegable) a la vez.
      function build(items, container, depth) {
        items.forEach(function (m) {
          LABELS[m.key] = m.label;
          var hasKids = m.children && m.children.length;
          if (hasKids) {
            var g = document.createElement('div'); g.className = 'nav-group';
            var head = document.createElement('button');
            head.className = 'nav-item nav-grouphead' + (depth > 0 ? ' nav-child' : '');
            head.innerHTML = (depth === 0 ? icon(m.icon) : '') +
                             '<span class="nav-label">' + m.label + '</span>' + chev();
            head.setAttribute('data-key', m.key);
            var sub = document.createElement('div'); sub.className = 'nav-sub';
            build(m.children, sub, depth + 1);
            head.addEventListener('click', function (e) {
              var chevEl = head.querySelector('.chev');
              var onChev = chevEl && chevEl.contains(e.target);
              // Si el grupo también es un área, al tocar el texto se abre el área.
              if (m.isArea && !onChev) { selectArea(m.key, m.label); g.classList.add('open'); }
              else g.classList.toggle('open');
            });
            g.appendChild(head); g.appendChild(sub); container.appendChild(g);
          } else {
            var b = document.createElement('button');
            b.className = 'nav-item' + (depth > 0 ? ' nav-child' : '');
            b.innerHTML = (depth === 0 ? icon(m.icon) : '') +
                          '<span class="nav-label">' + m.label + '</span>';
            b.setAttribute('data-key', m.key);
            b.addEventListener('click', function () { selectArea(m.key, m.label); });
            container.appendChild(b);
          }
        });
      }
      build(res.items || [], nav, 0);

      state.esAdmin = !!res.esAdmin;
      if (res.nombre) state.nombre = res.nombre;
      state.colaboradores = res.colaboradores || [];
      if (state.esAdmin) { state.verComo = state.nombre; construirVerComo(); }
      if (res.defaultKey) selectArea(res.defaultKey, res.defaultLabel, true);
      autoRecurrentes();
    }).catch(fail);
  }

  function selectArea(key, label, keepClosed) {
    state.key = key; state.label = label;
    sortState = { col: null, dir: 1 }; editingRow = -1;
    quickFilter = quickPending; quickPending = null;
    filters = []; pendingAutoFilter = true; closeFilterPopup(); renderFilterBar(); renderQuickBar();
    document.getElementById('areaTitle').textContent = label;
    var subEl = document.getElementById('areaSub');
    if (subEl) subEl.textContent = AREA_SUBTITULOS[key] || 'Gestión de ' + String(label).toLowerCase();
    var items = document.querySelectorAll('.nav-item');
    items.forEach(function (i) { i.classList.toggle('active', i.getAttribute('data-key') === key); });
    var active = document.querySelector('.nav-item.active');
    if (active) {
      var grp = active.closest('.nav-group');
      while (grp) { grp.classList.add('open'); grp = grp.parentElement.closest('.nav-group'); }
    }
    if (!keepClosed) closeNav();

    // Vistas especiales con pantalla propia
    var esDash = (key === 'dashboard');
    var esHome = (key === 'inicio');
    var esBit  = (key === 'bitacora');
    var esEspecial = esDash || esHome || esBit;
    var ph = document.getElementById('pageHead');
    if (ph) ph.style.display = esEspecial ? 'none' : 'block';
    document.getElementById('homeView').style.display = esHome ? 'block' : 'none';
    document.getElementById('dashView').style.display = esDash ? 'block' : 'none';
    document.getElementById('bitView').style.display = esBit ? 'block' : 'none';
    document.getElementById('tableView').style.display = esEspecial ? 'none' : 'block';
    document.querySelector('.controls').style.display = esEspecial ? 'none' : 'flex';
    document.getElementById('filterBar').style.display = esEspecial ? 'none' : 'flex';
    document.getElementById('summary').style.display = esEspecial ? 'none' : 'flex';
    if (esHome) { loadHome(); return; }
    if (esDash) { loadDashboard(); return; }
    if (esBit)  { loadBitacora(); return; }

    loadArea();
  }

  function loadArea() {
    document.getElementById('tableWrap').innerHTML = '<div class="state">Cargando...</div>';
    document.getElementById('count').textContent = '';
    state.categories = {}; state.lookup = null;
    Promise.all([
      api('data', { token: state.token, key: state.key, verComo: state.verComo }),
      api('categories', { token: state.token, key: state.key }).catch(function () { return {}; }),
      api('lookup', { token: state.token, key: state.key }).catch(function () { return null; })
    ]).then(function (r) {
      var data = r[0]; state.categories = r[1] || {};
      var lk = r[2]; state.lookup = (lk && lk.options && lk.options.length) ? lk : null;
      state.headers = data.headers || []; state.rows = data.rows || [];
      state.idsUsados = data.idsUsados || [];
      var puedeAgregar = data.connected && state.headers.length && !esSoloLectura(state.key);
      var addBtn = document.getElementById('openAddBtn');
      if (addBtn) addBtn.style.display = puedeAgregar ? '' : 'none';
      var timeBtn = document.getElementById('openTimeBtn');
      if (timeBtn) timeBtn.style.display = (puedeAgregar && /^pend_/.test(state.key)) ? '' : 'none';
      var genBtn = document.getElementById('openGenBtn');
      if (genBtn) genBtn.style.display = (state.esAdmin && state.key==='recurrentes') ? '' : 'none';
      if (!data.connected) {
        document.getElementById('tableWrap').innerHTML =
          '<div class="state">Esta área todavía no está conectada. Agrega su pestaña en SHEETS (lib/core.js).</div>';
        document.getElementById('formFields').innerHTML = '';
      } else if (!state.headers.length) {
        document.getElementById('tableWrap').innerHTML =
          '<div class="state">La hoja está vacía o no tiene encabezados en la fila 1.</div>';
        document.getElementById('formFields').innerHTML = '';
      } else {
        if (pendingAutoFilter) { pendingAutoFilter = false; aplicarFiltroAnual(); }
        renderFilterBar();
        renderTable();
        if (puedeAgregar) renderForm();
      }
    }).catch(fail);
  }

  var sortState = { col: null, dir: 1 };
  function parseNumber(v) {
    var s = String(v == null ? '' : v).trim();
    if (s === '') return null;
    s = s.replace(/[^0-9.,\-]/g, '').replace(/,/g, '');
    if (s === '' || s === '-' || s === '.') return null;
    var n = parseFloat(s);
    return isNaN(n) ? null : n;
  }

  // Columnas que se muestran como dinero ($ y separador de miles). Se comparan sin distinguir espacios/mayúsculas.
  var MONEY_FIELDS = ['Descuento','Subtotal','IVA','Total','Total Cobrado','Por Cobrar','Saldo','Monto','Importe','Precio',
                      'Salario Bruto Mensual','Salario Neto Mensual','SD','SDI','SBC',
                      'Cuentas por Cobrar','Cuentas por Pagar','Ingreso','Egreso','Cargo','Abono','Depósito','Retiro',
                      'Valor est.','Valor est','Valor estimado'];
  // Columnas de dinero que NO se suman en las tarjetas (solo se formatean)
  var NO_SUM_FIELDS = ['SD','SDI','SBC'];
  function isSummable(h) {
    return isMoneyCol(h) && !NO_SUM_FIELDS.some(function (n) { return norm(n) === norm(h); });
  }
  // Ancho máximo especial por columna (px). Las demás usan 220px (regla th,td).
  var WIDTH_FIELDS = { 'pendiente': 320, 'descripcion': 380, 'comentario': 360, 'comentarios': 360,
                       'status': 150, 'prioridad': 120, 'area': 130, 'semana': 90, 'mes': 70, 'revisado': 100,
                       'cliente': 190, 'responsable': 190, 'co-responsable': 190, 'revision por:': 170,
                       'responsable de solicitud': 190, 'estado / ¿a tiempo?': 130,
                       'fecha de solicitud': 150, 'fecha de entrega': 150, 'fecha de entrega estimada': 160,
                       'fecha de entrega real': 150, 'fecha de terminación': 150 };
  function colWidth(h) { return WIDTH_FIELDS[norm(h)] || null; }
  // Columnas que se muestran centradas (por nombre; tolera espacios/acentos/mayúsculas).
  var CENTER_FIELDS = ['Status','Prioridad','Área','Semana','Mes','Revisado','Estado / ¿A tiempo?',
                       'Fecha de Solicitud','Fecha de Entrega','Fecha de Entrega Estimada',
                       'Fecha de Entrega Real','Fecha de Terminación','Días háb. ciclo (solicitud→entrega)',
                       'Desviación días háb. (vs. supuesta)'];
  function isCenterCol(h) {
    var s = norm(h);
    return CENTER_FIELDS.some(function (c) { return norm(c) === s; });
  }
  function isMoneyCol(h) {
    var s = norm(h);
    return MONEY_FIELDS.some(function (m) { return norm(m) === s; });
  }
  function formatMoney(v) {
    var n = parseNumber(v);
    if (n === null) return String(v == null ? '' : v);
    var neg = n < 0; n = Math.abs(n);
    var parts = n.toFixed(2).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + '$' + parts[0] + '.' + parts[1];
  }
  var MESES = { enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12,
    ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,set:9,oct:10,nov:11,dic:12 };
  function parseDate(v) {
    var s = String(v == null ? '' : v).trim().toLowerCase();
    if (s === '') return null;
    var m;
    m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);
    if (m) return (+m[1]) * 10000 + (+m[2]) * 100 + (+m[3]);
    m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
    if (m) return (+m[3]) * 10000 + (+m[2]) * 100 + (+m[1]);
    m = s.match(/^(\d{1,2})\s+(?:de\s+)?([a-záéíóú]+)\.?\s+(?:de\s+)?(\d{4})$/);
    if (m && MESES[m[2]]) return (+m[3]) * 10000 + MESES[m[2]] * 100 + (+m[1]);
    return null;
  }
  function cellKind(v) {
    var s = String(v == null ? '' : v).trim();
    if (s === '') return 'empty';
    if (parseDate(s) !== null) return 'date';
    if (parseNumber(s) !== null && !/[a-z]{2,}/i.test(s)) return 'number';
    return 'text';
  }
  function columnType(h) {
    var d = 0, n = 0, total = 0, lim = Math.min(state.rows.length, 60);
    for (var i = 0; i < lim; i++) {
      var k = cellKind(state.rows[i][h]);
      if (k === 'empty') continue;
      total++;
      if (k === 'date') d++; else if (k === 'number') n++;
    }
    if (total === 0) return 'text';
    if (d / total >= 0.6) return 'date';
    if (n / total >= 0.7) return 'number';
    return 'text';
  }
  function sortRows(rows) {
    if (sortState.col === null) return rows;
    var h = sortState.col, dir = sortState.dir, type = columnType(h);
    return rows.slice().sort(function (a, b) {
      var va = a[h], vb = b[h];
      var ea = (va == null || String(va).trim() === ''), eb = (vb == null || String(vb).trim() === '');
      if (ea && eb) return 0; if (ea) return 1; if (eb) return -1;
      var cmp;
      if (type === 'number') cmp = (parseNumber(va) || 0) - (parseNumber(vb) || 0);
      else if (type === 'date') cmp = (parseDate(va) || 0) - (parseDate(vb) || 0);
      else cmp = String(va).localeCompare(String(vb), 'es', { numeric: true, sensitivity: 'base' });
      return cmp * dir;
    });
  }

  // ===== Filtros =====
  var filters = [];   // {col, type:'values'|'range', values:[], from:'', to:''}

  // Áreas que arrancan con filtro de fecha del año en curso (columna a usar).
  var AUTO_DATE_FILTER = {};   // los pendientes se muestran completos, sin recortar por año
  var pendingAutoFilter = false;
  function aplicarFiltroAnual() {
    var nombre = AUTO_DATE_FILTER[state.key];
    if (!nombre) return;
    var col = state.headers.filter(function (x) { return norm(x) === norm(nombre); })[0];
    if (!col) {
      // Respaldo: primera columna que parezca de fecha
      col = state.headers.filter(function (x) { return norm(x).indexOf('fecha') === 0; })[0];
    }
    if (!col) return;
    filters.push({ col: col, type: 'range', from: isoInicioAnio(), to: isoHoy() });
  }

  // Columnas filtrables por área. Si un área no está aquí, se pueden filtrar todas.
  var PEND_FILTERS = ['Cliente','Responsable','Co-Responsable','Revisión por:','Área','Prioridad','Status',
                     'Responsable de solicitud','Semana','Revisado'];
  var FILTER_FIELDS = {
    pend_abiertos: PEND_FILTERS, pend_norev: PEND_FILTERS, pend_todos: PEND_FILTERS, pend_cerrados: PEND_FILTERS
  };
  function filterableHeaders() {
    var allow = FILTER_FIELDS[state.key];
    if (allow === undefined) return state.headers;   // no configurada: todas
    if (!allow.length) return [];                     // configurada sin filtros: ninguna
    return state.headers.filter(function (h) {
      return allow.some(function (a) { return norm(a) === norm(h); });
    });
  }

  function dateColumns() {
    return state.headers.filter(function (h) { return columnType(h) === 'date'; });
  }
  function distinctValues(col) {
    var seen = {}, out = [];
    state.rows.forEach(function (r) {
      var v = String(r[col] == null ? '' : r[col]).trim();
      if (v && !seen[v]) { seen[v] = 1; out.push(v); }
    });
    out.sort(function (a, b) { return a.localeCompare(b, 'es', { numeric: true }); });
    return out;
  }
  function passesFilters(r) {
    return filters.every(function (f) {
      var v = r[f.col];
      if (f.type === 'values') {
        return f.values.indexOf(String(v == null ? '' : v).trim()) !== -1;
      }
      var d = parseDate(v);
      if (d === null) return false;
      if (f.from) { var df = parseInt(f.from.replace(/-/g, ''), 10); if (d < df) return false; }
      if (f.to)   { var dt = parseInt(f.to.replace(/-/g, ''), 10);   if (d > dt) return false; }
      return true;
    });
  }
  function renderFilterBar() {
    var bar = document.getElementById('filterBar');
    var canFilter = filterableHeaders().length > 0;
    document.getElementById('filterBtn').style.display = canFilter ? '' : 'none';
    if (!canFilter) { bar.innerHTML = ''; return; }
    if (!filters.length) { bar.innerHTML = '<span class="nofilters">No hay filtros seleccionados</span>'; return; }
    var html = '';
    filters.forEach(function (f, i) {
      var desc = (f.type === 'values')
        ? (f.values.length > 2 ? f.values.length + ' seleccionados' : f.values.join(', '))
        : ((f.from ? isoToLargo(f.from) : '…') + ' → ' + (f.to ? isoToLargo(f.to) : '…'));
      html += '<span class="chip"><b>' + esc(String(f.col).trim()) + ':</b> ' + esc(desc) +
              '<span class="x" data-i="' + i + '">×</span></span>';
    });
    html += '<button id="clearFiltersBtn" type="button" style="padding:5px 10px;font-size:13px">Quitar todos</button>';
    bar.innerHTML = html;
  }
  function openFilterPopup() {
    var bar = document.getElementById('filterBar');
    if (document.getElementById('filterPop')) { closeFilterPopup(); return; }
    var cols = filterableHeaders();
    if (!cols.length) { toast('No hay columnas filtrables en esta área.', 'err'); return; }
    var pop = document.createElement('div');
    pop.className = 'filter-pop'; pop.id = 'filterPop';
    var opts = cols.map(function (h) {
      return '<option value="' + esc(h).replace(/"/g, '&quot;') + '">' + esc(String(h).trim()) + '</option>';
    }).join('');
    pop.innerHTML = '<h4>Filtrar por columna</h4>' +
      '<select id="fCol">' + opts + '</select>' +
      '<div id="fBody"></div>' +
      '<div class="filter-actions"><button id="fCancel" type="button">Cancelar</button>' +
      '<button class="primary" id="fApply" type="button">Aplicar</button></div>';
    bar.appendChild(pop);
    document.getElementById('fCol').addEventListener('change', renderFilterBody);
    document.getElementById('fCancel').addEventListener('click', closeFilterPopup);
    document.getElementById('fApply').addEventListener('click', applyFilterFromPopup);
    renderFilterBody();
  }
  function closeFilterPopup() {
    var p = document.getElementById('filterPop'); if (p) p.remove();
  }
  function renderFilterBody() {
    var col = document.getElementById('fCol').value;
    var body = document.getElementById('fBody');
    if (columnType(col) === 'date') {
      body.innerHTML = '<h4>Rango de fechas</h4><div class="filter-range">' +
        '<input type="date" id="fFrom"> <span>→</span> <input type="date" id="fTo"></div>';
      return;
    }
    var vals = distinctValues(col);
    var html = '<h4>Valores</h4>';
    if (vals.length > 6) {
      html += '<div class="fv-tools"><input type="search" id="fSearch" placeholder="Buscar…">' +
              '<button type="button" id="fAll">Todos</button>' +
              '<button type="button" id="fNone">Ninguno</button></div>';
    }
    html += '<div class="filter-values" id="fList">';
    if (!vals.length) html += '<div class="fv-empty">Sin valores</div>';
    vals.forEach(function (v) {
      var ev = esc(v);
      html += '<label data-v="' + ev.replace(/"/g, '&quot;') + '">' +
              '<input type="checkbox" class="fVal" value="' + ev.replace(/"/g, '&quot;') + '">' +
              '<span>' + ev + '</span></label>';
    });
    html += '</div>';
    body.innerHTML = html;

    var s = document.getElementById('fSearch');
    if (s) {
      s.addEventListener('input', function () {
        var q = s.value.trim().toLowerCase();
        document.querySelectorAll('#fList label').forEach(function (l) {
          var t = l.getAttribute('data-v').toLowerCase();
          l.style.display = (!q || t.indexOf(q) !== -1) ? '' : 'none';
        });
      });
      document.getElementById('fAll').addEventListener('click', function () {
        document.querySelectorAll('#fList label').forEach(function (l) {
          if (l.style.display !== 'none') l.querySelector('.fVal').checked = true;
        });
      });
      document.getElementById('fNone').addEventListener('click', function () {
        document.querySelectorAll('.fVal').forEach(function (c) { c.checked = false; });
      });
    }
  }
  function applyFilterFromPopup() {
    var col = document.getElementById('fCol').value;
    if (columnType(col) === 'date') {
      var from = document.getElementById('fFrom').value, to = document.getElementById('fTo').value;
      if (!from && !to) { toast('Elige al menos una fecha.', 'err'); return; }
      filters.push({ col: col, type: 'range', from: from, to: to });
    } else {
      var vals = [];
      document.querySelectorAll('.fVal:checked').forEach(function (c) { vals.push(c.value); });
      if (!vals.length) { toast('Elige al menos un valor.', 'err'); return; }
      filters.push({ col: col, type: 'values', values: vals });
    }
    closeFilterPopup(); renderFilterBar(); renderTable();
  }

  // ===== Resumen =====
  // Columnas de dinero que NO se muestran como tarjeta en ciertas áreas.
  var SUMMARY_EXCLUDE = {};
  function excluidaDeResumen(h2) {
    var ex = SUMMARY_EXCLUDE[state.key] || [];
    return ex.some(function (e) { return norm(e) === norm(h2); });
  }

  // Columna que se desglosa en tarjetas de conteo (una por cada valor). Por área.
  var BREAKDOWN_FIELDS = {
    pend_abiertos: 'Status', pend_norev: 'Status', pend_todos: 'Status', pend_cerrados: 'Status'
  };
  // Áreas donde el desglose suma un monto (columna de valor) en vez de contar filas.
  var BREAKDOWN_MONEY = {};
  function breakdownCol() {
    var name = BREAKDOWN_FIELDS[state.key] || 'Status';   // por defecto, Status
    return state.headers.filter(function (h) { return norm(h) === norm(name); })[0];
  }
  function colBy(nombre) {
    return state.headers.filter(function (h) { return norm(h) === norm(nombre); })[0];
  }

  function renderSummary(rows) {
    var box = document.getElementById('summary');
    if (!state.headers.length) { box.innerHTML = ''; return; }

    var html = '<div class="sum-card"><div class="k">Registros</div><div class="v">' +
               rows.length.toLocaleString('es-MX') + '</div></div>';

    // Tarjeta de vencidos: filas abiertas cuya fecha compromiso ya pasó
    var cComp = state.headers.filter(function (h) {
      return norm(h) === norm('Fecha de Entrega Estimada') || norm(h) === norm('Fecha de Entrega') ||
             norm(h) === norm('Fecha límite') || norm(h) === norm('Vencimiento');
    })[0];
    var cEst = state.headers.filter(function (h) {
      return norm(h) === 'estatus' || norm(h) === 'status';
    })[0];
    if (cComp) {
      var hoyN = parseInt(isoHoy().replace(/-/g, ''), 10);
      var nVenc = 0;
      rows.forEach(function (r) {
        if (cEst && frontCerrado(r[cEst])) return;
        var iso = largoToIso(r[cComp]);
        if (!iso) return;
        if (parseInt(String(iso).replace(/-/g, ''), 10) < hoyN) nVenc++;
      });
      if (nVenc) html += '<div class="sum-card alerta"><div class="k">Vencidos</div><div class="v">' +
                         nVenc.toLocaleString('es-MX') + '</div></div>';
    }

    // Desglose monetario (p. ej. Leads: Valor est. por Etapa)
    var bm = BREAKDOWN_MONEY[state.key];
    if (bm) {
      var byCol = colBy(bm.by), sumCol = colBy(bm.sum);
      if (byCol && sumCol) {
        var montos = {}, orderM = [];
        rows.forEach(function (r) {
          var k = String(r[byCol] == null ? '' : r[byCol]).trim();
          if (!k) return;
          var n = parseNumber(r[sumCol]);
          if (montos[k] === undefined) { montos[k] = 0; orderM.push(k); }
          if (n !== null) montos[k] += n;
        });
        orderM.sort(function (a, b) { return montos[b] - montos[a]; });
        orderM.forEach(function (k) {
          html += '<div class="sum-card"><div class="k">' + esc(k) + '</div><div class="v">' +
                  esc(formatMoney(montos[k])) + '</div></div>';
        });
      }
      box.innerHTML = html;
      return;   // en estas áreas, el desglose monetario reemplaza el resto
    }

    // Una tarjeta por cada valor presente en la columna de desglose
    var bCol = breakdownCol();
    if (bCol) {
      var counts = {}, order = [];
      rows.forEach(function (r) {
        var v = String(r[bCol] == null ? '' : r[bCol]).trim();
        if (!v) return;
        if (counts[v] === undefined) { counts[v] = 0; order.push(v); }
        counts[v]++;
      });
      order.sort(function (a, b) { return counts[b] - counts[a]; }); // del más frecuente al menos
      order.forEach(function (v) {
        html += '<div class="sum-card"><div class="k">' + esc(v) + '</div><div class="v">' +
                counts[v].toLocaleString('es-MX') + '</div></div>';
      });
    }

    // Las sumas de dinero consideran solo los activos (si hay columna Status)
    var statusCol = state.headers.filter(function (h) { return norm(h) === 'status'; })[0];
    var sumRows = rows, soloActivos = false;
    if (statusCol) {
      var activos = rows.filter(function (r) {
        var v = norm(r[statusCol]);
        return v === 'activo' || v === 'activa';
      });
      if (activos.length) { sumRows = activos; soloActivos = true; }
    }

    state.headers.forEach(function (h) {
      if (!isSummable(h) || excluidaDeResumen(h)) return;
      var sum = 0, any = false;
      sumRows.forEach(function (r) {
        var n = parseNumber(r[h]); if (n !== null) { sum += n; any = true; }
      });
      if (!any) return;
      var titulo = esc(String(h).trim()) + (soloActivos ? ' (activos)' : '');
      html += '<div class="sum-card"><div class="k">' + titulo +
              '</div><div class="v">' + esc(formatMoney(sum)) + '</div></div>';
    });
    box.innerHTML = html;
  }

  var MESES_NOM = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  // Convierte 'AAAA-MM-DD' (del selector) a '15 enero 2026'
  function largoToIso(v) {
    // Convierte "14 julio 2026", "2026-07-14" o "14/07/2026" a AAAA-MM-DD
    var s = String(v == null ? '' : v).trim();
    if (!s) return '';
    var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) return m[1] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[3]).padStart(2, '0');
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) return m[3] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[1]).padStart(2, '0');
    var meses = { enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12 };
    m = s.toLowerCase().match(/^(\d{1,2})\s+(?:de\s+)?([a-záéíóú]+)\.?\s+(?:de\s+)?(\d{4})$/);
    if (m && meses[m[2]]) return m[3] + '-' + String(meses[m[2]]).padStart(2, '0') + '-' + String(m[1]).padStart(2, '0');
    return '';
  }
  function isoToLargo(iso) {
    var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return iso;
    return parseInt(m[3], 10) + ' ' + MESES_NOM[parseInt(m[2], 10) - 1] + ' ' + m[1];
  }
  // Muestra en la tabla cualquier fecha reconocible como '15 enero 2026'
  function formatDateCell(v) {
    var d = parseDate(v);
    if (d === null) return String(v == null ? '' : v);
    var y = Math.floor(d / 10000), mo = Math.floor((d % 10000) / 100), da = d % 100;
    if (mo < 1 || mo > 12) return String(v);
    return da + ' ' + MESES_NOM[mo - 1] + ' ' + y;
  }

  // Columnas que NO se muestran en la tabla de registros. Por área.
  var HIDE_COLUMNS = {
    ventas_registro: ['Carpeta', 'Contrato', 'Año'],
    cxc: ['Carpeta', 'Contrato', 'Año'],
    cli_membresias: ['Integrantes']
  };
  // Columnas ocultas en TODAS las tablas
  var HIDE_ALWAYS = ['Mes'];
  function visibleHeaders() {
    var hide = (HIDE_COLUMNS[state.key] || []).concat(HIDE_ALWAYS);
    return state.headers.filter(function (h) {
      return !hide.some(function (x) { return norm(x) === norm(h); });
    });
  }

  // ===================== INICIO =====================
  var ACCESOS = [
    { key:'pend_abiertos', label:'Mis abiertos',   icon:'check', sub:'Ver y actualizar' },
    { key:'pend_todos',    label:'Nuevo pendiente', icon:'clock', sub:'Registrar uno' },
    { key:'pend_norev',    label:'Por revisar',    icon:'flag',  sub:'Terminados sin revisar' },
    { key:'dashboard',     label:'Análisis',       icon:'grid',  sub:'Indicadores' }
  ];
  var LABELS = {};
  function primerNombre(n){ n=String(n||'').trim(); if(!n) return ''; var p=n.split(/\s+/); return p.slice(0,2).join(' '); }
  function saludo() {
    var hh = new Date().getHours();
    if (hh < 12) return 'Buenos días';
    if (hh < 19) return 'Buenas tardes';
    return 'Buenas noches';
  }
  function fechaLarga() {
    var d = new Date();
    var dias = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
    var mes = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
               'septiembre','octubre','noviembre','diciembre'];
    return dias[d.getDay()] + ', ' + d.getDate() + ' de ' + mes[d.getMonth()] + ' de ' + d.getFullYear();
  }

  function diasAtraso(n) {
    if (n === null || n === undefined) return '';
    var a = Math.abs(n);
    if (n < 0) return a === 1 ? '1 día' : a + ' días';
    if (n === 0) return 'Hoy';
    if (n === 1) return 'Mañana';
    return 'En ' + n + ' días';
  }

  var calState = null;   // {y, m}  (m: 0-11)
  var calPend = [];      // pendientes del alcance elegido
  var calSel = null;     // día seleccionado (yyyymmdd)
  var calTitulo = '';
  var MES_NOM = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var DOW = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  function hoyNumF() {
    var f = new Intl.DateTimeFormat('en-CA', { timeZone:'America/Mexico_City', year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date());
    return parseInt(String(f).replace(/-/g,''), 10);
  }
  function ymd(y,m,d){ return y*10000 + (m+1)*100 + d; }
  function diasTxt(n) {
    if (n === null || n === undefined) return '';
    var a = Math.abs(n);
    if (n < 0) return 'hace ' + (a === 1 ? '1 día' : a + ' días');
    if (n === 0) return 'Hoy';
    if (n === 1) return 'Mañana';
    return 'En ' + n + ' días';
  }
  function claseEvento(p, hoy) {
    if (p.cerr) return 'ev-done';
    if (p.dc && p.dc < hoy) return 'ev-venc';
    if (p.dc === hoy) return 'ev-hoy';
    return 'ev-open';
  }

  function renderHome(d) {
    calPend = d.pendientes || [];
    calSel = null;
    if (d.verComo === '__todos__') calTitulo = 'Todos los pendientes';
    else if (state.esAdmin && norm(d.verComo) !== norm(state.nombre)) calTitulo = 'Pendientes de ' + primerNombre(d.verComo);
    else calTitulo = 'Mis pendientes';
    var hoy = hoyNumF();
    if (!calState) calState = { y: Math.floor(hoy/10000), m: (Math.floor(hoy/100)%100) - 1 };

    var r = d.resumen || {};
    var titulo;
    if (d.verComo === '__todos__') titulo = 'Todos los pendientes';
    else if (state.esAdmin && norm(d.verComo) !== norm(state.nombre)) titulo = 'Pendientes de ' + primerNombre(d.verComo);
    else titulo = saludo() + (state.nombre ? ', ' + esc(primerNombre(state.nombre)) : '');

    var h = '';
    h += '<div class="hero"><h2>' + esc(titulo) + '</h2><p>' + esc(fechaLarga()) + '</p></div>';

    h += '<div class="kpi-grid" style="margin-bottom:24px">' +
      '<div class="kpi dark"><div class="k">Abiertos</div><div class="v">' + fmtNum(r.abiertos) +

      '<div class="kpi"><div class="k">Vencidos</div><div class="v" style="color:' +
        ((r.vencidos||0)>0?'var(--danger)':'inherit') + '">' + fmtNum(r.vencidos) + '</div></div>' +
      '<div class="kpi"><div class="k">Vencen hoy</div><div class="v">' + fmtNum(r.hoy) + '</div></div>' +
      '<div class="kpi"><div class="k">Próximos 7 días</div><div class="v">' + fmtNum(r.semana) + '</div></div>' +
      '<div class="kpi"><div class="k">Sin revisar</div><div class="v">' + fmtNum(r.sinRevisar) + '</div></div>' +
      '<div class="kpi"><div class="k">Terminados del mes</div><div class="v">' + fmtNum(r.cerradosMes) + '</div></div>' +
      '</div>';

    // ===== Calendario =====
    h += '<div class="dash-section"><div class="cal-top">' +
      '<h3 style="margin:0">' + esc(calTitulo) + '</h3>' +
      '<div class="cal-nav">' +
        '<button id="calPrev" class="cal-btn" title="Mes anterior">‹</button>' +
        '<span id="calLabel" class="cal-label"></span>' +
        '<button id="calNext" class="cal-btn" title="Mes siguiente">›</button>' +
        '<button id="calHoy" class="cal-hoy">Hoy</button>' +
      '</div></div>' +
      '<div class="cal-legend">' +
        '<span><i class="ev-venc"></i>Vencido</span><span><i class="ev-hoy"></i>Vence hoy</span>' +
        '<span><i class="ev-open"></i>Abierto</span><span><i class="ev-done"></i>Terminado</span></div>' +
      '<div id="calWrap"></div>' +
      '<div id="calDetail"></div>' +
      '</div>';

    // Avisos
    h += '<div class="dash-section"><h3>Requiere atención</h3>';
    var av = d.avisos || [];
    if (!av.length) h += '<div class="all-good">Todo al día. Nada vencido ni por vencer.</div>';
    else {
      h += '<div class="alert-list">';
      av.forEach(function (a) {
        h += '<div class="alert ' + esc(a.tipo) + '"><span class="an">' + fmtNum(a.n) + '</span>' +
          '<span class="ab"><span class="at">' + esc(a.titulo) + '</span><span class="ad">' + esc(a.detalle) +
          '</span></span><button data-go="' + esc(a.area) + '" data-filtro="' + esc(a.filtro||'') + '">Ver</button></div>';
      });
      h += '</div>';
    }
    h += '</div>';

    // Pendientes sin fecha de entrega (abiertos)
    var sinFecha = calPend.filter(function(p){ return !p.cerr && !p.dc; });
    if (sinFecha.length) {
      var sfRows = sinFecha.slice(0,10).map(function(p){
        return '<tr><td title="'+esc(p.t)+'">'+esc(p.t||'(sin título)')+'</td><td>'+esc(p.cl)+'</td>' +
          (d.verComo==='__todos__'?'<td>'+esc(primerNombre((p.rs&&p.rs[0])||p.r))+'</td>':'') +
          '<td>'+chipHTML(p.e||'—')+'</td></tr>';
      }).join('');
      h += '<div class="dash-section"><h3>Sin fecha de entrega</h3><div class="panel"><div class="panel-body">' +
        '<table class="mini-table"><thead><tr><th>Pendiente</th><th>Cliente</th>' +
        (d.verComo==='__todos__'?'<th>Responsable</th>':'') + '<th>Estatus</th></tr></thead><tbody>' +
        sfRows + '</tbody></table></div></div></div>';
    }

    // Carga por responsable (solo en "Todos")
    if (d.verComo === '__todos__' && (d.porResponsable||[]).length) {
      var pr = d.porResponsable, maxN = pr[0].n || 1;
      var bars = pr.map(function (x) {
        var pct = Math.max(3, Math.round((x.n/maxN)*100));
        return '<div class="bar-row" title="' + esc(x.nombre) + '"><span class="lbl">' + esc(primerNombre(x.nombre)) +
          '</span><span class="bar-track"><span class="bar-fill" style="width:' + pct + '%"></span></span>' +
          '<span class="val">' + fmtNum(x.n) + (x.vencidos ? ' <span class="chip-tag chip-no">' + x.vencidos + ' venc.</span>' : '') + '</span></div>';
      }).join('');
      h += '<div class="dash-section"><h3>Carga por responsable</h3><div class="panel"><div class="panel-body">' +
        '<div class="bars">' + bars + '</div></div></div></div>';
    }

    var box = document.getElementById('homeView');
    box.innerHTML = h;
    box.querySelectorAll('[data-go]').forEach(function (b) {
      b.addEventListener('click', function () {

        selectArea(k, LABELS[k] || (el ? el.textContent.trim() : k), true);

    document.getElementById('calNext').addEventListener('click', function(){ calMover(1); });
    document.getElementById('calHoy').addEventListener('click', function(){
      var t = hoyNumF(); calState = { y:Math.floor(t/10000), m:(Math.floor(t/100)%100)-1 }; calSel = t; pintarCalendario();
    });

  }

  function calMover(delta) {
    var m = calState.m + delta, y = calState.y;
    if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
    calState = { y:y, m:m }; pintarCalendario();
  }

  function pintarCalendario() {
    var y = calState.y, m = calState.m, hoy = hoyNumF();
    document.getElementById('calLabel').textContent = MES_NOM[m] + ' ' + y;

    // agrupa pendientes por día
    var porDia = {};
    calPend.forEach(function(p){ if (p.dc) { (porDia[p.dc] = porDia[p.dc] || []).push(p); } });

    var primero = new Date(Date.UTC(y, m, 1));
    var startDow = (primero.getUTCDay() + 6) % 7;      // Lunes = 0
    var diasMes = new Date(Date.UTC(y, m+1, 0)).getUTCDate();
    var diasPrev = new Date(Date.UTC(y, m, 0)).getUTCDate();

    var html = '<div class="cal">';
    DOW.forEach(function(dn){ html += '<div class="cal-dow">' + dn + '</div>'; });

    var celda = 0, totalCeldas = Math.ceil((startDow + diasMes) / 7) * 7;
    for (var i = 0; i < totalCeldas; i++) {
      var dnum, mm = m, yy = y, fuera = false;
      if (i < startDow) { dnum = diasPrev - startDow + 1 + i; mm = m-1; fuera = true; if (mm<0){mm=11;yy--;} }
      else if (i >= startDow + diasMes) { dnum = i - (startDow + diasMes) + 1; mm = m+1; fuera = true; if (mm>11){mm=0;yy++;} }
      else { dnum = i - startDow + 1; }
      var key = ymd(yy, mm, dnum);
      var evs = porDia[key] || [];
      var esHoy = (key === hoy);
      var abiertosDia = evs.filter(function(e){return !e.cerr;}).length;
      var cls = 'cal-cell' + (fuera ? ' fuera' : '') + (esHoy ? ' hoy' : '') + (key===calSel ? ' sel' : '') + (evs.length ? ' con' : '');
      html += '<div class="' + cls + '" data-day="' + key + '">';
      html += '<span class="cal-d">' + dnum + (abiertosDia ? '<span class="cal-n">' + abiertosDia + '</span>' : '') + '</span>';
      var vis = evs.slice(0, 3);
      vis.forEach(function(e){
        html += '<span class="cal-ev ' + claseEvento(e, hoy) + '" title="' + esc(e.t) + (e.cl?' · '+esc(e.cl):'') + '">' + esc(e.t || '—') + '</span>';
      });
      if (evs.length > 3) html += '<span class="cal-mas">+' + (evs.length - 3) + ' más</span>';
      html += '</div>';
    }
    html += '</div>';
    document.getElementById('calWrap').innerHTML = html;

    document.querySelectorAll('#calWrap .cal-cell').forEach(function(c){
      c.addEventListener('click', function(){
        calSel = parseInt(c.getAttribute('data-day'), 10);
        document.querySelectorAll('#calWrap .cal-cell').forEach(function(x){ x.classList.remove('sel'); });
        c.classList.add('sel');
        pintarDetalleDia();
      });
    });
    if (calSel && Math.floor(calSel/100)%100 === m+1 && Math.floor(calSel/10000) === y) pintarDetalleDia();
    else document.getElementById('calDetail').innerHTML = '';
  }

  function pintarDetalleDia() {
    var hoy = hoyNumF();
    var evs = calPend.filter(function(p){ return p.dc === calSel; });
    var fstr = formatDateCell(String(calSel).replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3'));
    var box = document.getElementById('calDetail');
    if (!evs.length) { box.innerHTML = '<div class="cal-det"><h4>' + esc(fstr) + '</h4><div class="dash-empty">Sin pendientes este día.</div></div>'; return; }
    var rows = evs.sort(function(a,b){ return (a.cerr?1:0)-(b.cerr?1:0); }).map(function(p){
      var quien = (p.rs && p.rs.length) ? p.rs.map(primerNombre).join(', ') : primerNombre(p.r);
      return '<tr><td><span class="cal-dot ' + claseEvento(p, hoy) + '"></span></td>' +
        '<td title="'+esc(p.t)+'">'+esc(p.t||'(sin título)')+'</td>' +
        '<td>'+esc(p.cl)+'</td><td title="'+esc(quien)+'">'+esc(quien)+'</td>' +
        '<td>'+chipHTML(p.pri||'—')+'</td><td>'+chipHTML(p.e||'—')+'</td></tr>';
    }).join('');
    box.innerHTML = '<div class="cal-det"><h4>' + esc(fstr) + ' · ' + evs.length + ' pendiente' + (evs.length>1?'s':'') + '</h4>' +
      '<table class="mini-table"><thead><tr><th></th><th>Pendiente</th><th>Cliente</th><th>Responsable</th><th>Prioridad</th><th>Estatus</th></tr></thead><tbody>' +
      rows + '</tbody></table></div>';
  }

  function loadHome() {
    document.getElementById('homeView').innerHTML =
      '<div class="state" style="padding:60px 0">Cargando…</div>';

      });

  // ===================== DASHBOARD =====================
  var MESES_CORTO = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var dashData = null;                       // datos crudos del servidor
  function isoHoy() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
           '-' + String(d.getDate()).padStart(2, '0');
  }
  function isoInicioAnio() { return new Date().getFullYear() + '-01-01'; }
  // Arranca filtrado del 1 de enero del año en curso a hoy
  var dashRange = { from: '', to: '' };

  function fmtNum(n) { return (n || 0).toLocaleString('es-MX'); }
  function fmtMoneyShort(n) {
    n = n || 0;
    var neg = n < 0, a = Math.abs(n);
    var s;
    if (a >= 1000000) s = '$' + (a / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';

  function cargarPendientesTiempo() {
    var colab = document.getElementById('tlColab').value;
    var sel = document.getElementById('tlPendSel');
    sel.innerHTML = '<option value="">Cargando…</option>';
    // Trae los pendientes abiertos de ese colaborador (para admin filtra por él; colaborador ve los suyos)
    api('data', { token: state.token, key: 'pend_abiertos', verComo: colab }).then(function(d){
      var hT = (d.headers||[]).filter(function(h){return norm(h)===norm('Pendiente');})[0];
      var hC = (d.headers||[]).filter(function(h){return norm(h)===norm('Cliente');})[0];
      tlPendientes = (d.rows||[]).map(function(r){ return { t: hT?String(r[hT]||''):'', c: hC?String(r[hC]||''):'' }; })
        .filter(function(x){ return x.t.trim(); });
      var opts = '<option value="">— elige un pendiente —</option>';
      tlPendientes.forEach(function(p, i){ opts += '<option value="'+i+'">'+esc(p.t)+(p.c?' — '+esc(p.c):'')+'</option>'; });
      opts += '<option value="__manual__">✎ Otro / trabajo interno…</option>';
      sel.innerHTML = opts;
      // preselección por contexto
      if (tlContexto.pendiente) {
        var idx = tlPendientes.findIndex(function(p){ return norm(p.t)===norm(tlContexto.pendiente); });
        if (idx !== -1) { sel.value = String(idx); aplicarPendienteTiempo(); }
      }
      sel.addEventListener('change', aplicarPendienteTiempo);
    }).catch(function(){ sel.innerHTML = '<option value="__manual__">✎ Escribir manualmente…</option>'; });
  }
  function aplicarPendienteTiempo() {
    var sel = document.getElementById('tlPendSel');
    var v = sel.value;
    var hid = document.getElementById('tlPend');
    if (v === '' || v === '__manual__') { hid.value = ''; return; }
    var p = tlPendientes[parseInt(v,10)]; if (!p) return;
    hid.value = p.t;
    // fija el cliente del pendiente (agrega la opción si no está en la lista)
    var cli = document.getElementById('tlCliente');
    if (cli && p.c) {
      if (cli.tagName === 'SELECT') {
        var existe = Array.prototype.some.call(cli.options, function(o){ return norm(o.value||o.textContent)===norm(p.c); });
        if (!existe) { var o=document.createElement('option'); o.textContent=p.c; cli.appendChild(o); }
        cli.value = p.c;
      } else { cli.value = p.c; }
    }
    // sugiere la actividad con el título del pendiente si está vacía
    if (tlActividades.length && !String(tlActividades[0].actividad).trim()) {
      tlActividades[0].actividad = p.t; pintarActividades();
    }
    setTimeout(function(){ var f=document.querySelector('#tlActs .tl-hrs'); if(f) f.focus(); }, 20);
  }

  // Campos visibles en "Agregar registro" por área (en orden).
  // Un área que no esté acá muestra todas sus columnas.
  var PEND_FORM = ['Pendiente','Cliente','Descripción','Área','Responsable','Co-Responsable',
                  'Revisión por:','Prioridad','Fecha de Entrega Estimada','Fecha de Entrega','Status','Comentario'];
  var REC_FORM = ['Activo','Pendiente','Cliente','Área','Responsable','Co-Responsable','Revisión por:','Prioridad','Frecuencia','Regla','Meses','Descripción'];
  var FORM_FIELDS = {
    pend_abiertos: PEND_FORM, pend_norev: PEND_FORM, pend_todos: PEND_FORM, pend_cerrados: PEND_FORM,
    recurrentes: REC_FORM
  };
  // Campos que se llenan solos y NO se muestran en el formulario
  var AUTO_SOLICITANTE = ['Responsable de solicitud'];
  var AUTO_HOY = ['Fecha de Solicitud'];
  function esCampoAuto(h){
    return AUTO_SOLICITANTE.some(function(a){return norm(a)===norm(h);}) ||
           AUTO_HOY.some(function(a){return norm(a)===norm(h);});
  }
  // Campos que NO se muestran en "Agregar registro" (el resto sí). Por área.
  var EXCLUDE_FIELDS = {
    cli_membresias: ['Expediente', 'Integrantes', 'Contrato'],
    cli_pit: ['Carpeta'],
    rrhh_colaboradores: ['Edad', 'Fecha de baja', 'Meses de Antigüedad', 'Contrato', 'Expediente', 'SD'],
    rrhh_incidencias: ['Mes']
  };
  // Campos que se muestran solo como referencia (no editables, no se guardan: los calcula la hoja).
  var READONLY_FIELDS = {
    inventarios: ['Categoría'],
    rrhh_incidencias: ['Puesto', 'Área', 'Departamento'],
    rrhh_colaboradores: ['Área', 'Departamento', 'SD']
  };
  function isReadonlyField(h) {
    return (READONLY_FIELDS[state.key] || []).some(function (r) { return norm(r) === norm(h); });
  }
  function norm(s) { return String(s).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

  // ----- ETIQUETAS DE COLOR (chips) para valores de desplegable -----
  function esColumnaChip(h) { return !!categoryFor(h); }
  var CHIP_ROT = ['a','b','c','d','e','f'];
  function chipClass(valor) {
    var v = norm(valor);
    if (v.indexOf('terminado') === 0 || v === 'true' || v === 'verdadero' || v === 'si' ||
        v === '3. baja' || v === 'baja')
      return 'chip-ok';
    if (v === 'cancelado' || v === 'vencido' || v === 'false' || v === 'no' ||
        v === '0. urgente' || v === 'urgente')
      return 'chip-no';
    if (v === 'en proceso' || v === 'sin empezar' || v === 'falta por parte del cliente' ||
        v === 'en revision' || v === '1. alta' || v === '2. media' || v === 'alta' || v === 'media' ||
        v === 'a tiempo' || v === 'tarde')
      return 'chip-warn';
    var s = 0;
    for (var i = 0; i < v.length; i++) s = (s * 31 + v.charCodeAt(i)) >>> 0;
    return 'chip-' + CHIP_ROT[s % CHIP_ROT.length];
  }
  function chipHTML(valor) {
    var t = String(valor).trim();
    return '<span class="chip-tag ' + chipClass(t) + '">' + esc(t) + '</span>';
  }

  function categoryFor(name) {
    var key = norm(name);
    var found = Object.keys(state.categories || {}).filter(function (k) { return norm(k) === key; })[0];
    return found ? { key: found, options: state.categories[found] } : null;
  }
  function onSelectChange(sel, name) {
    if (sel.value !== '__add__') return;
    var val = window.prompt('Nueva opción para "' + String(name).trim() + '":');
    sel.value = '';
    if (!val || !val.trim()) return;
    val = val.trim();
    sel.disabled = true;
    api('categories', { token: state.token, key: state.key, add: true, categoria: String(name).trim(), valor: val })
      .then(function () {
        var cat = categoryFor(name);
        var k = cat ? cat.key : String(name).trim();
        if (!state.categories[k]) state.categories[k] = [];
        state.categories[k].push(val);
        var addOpt = sel.querySelector('option[value="__add__"]');
        var o = document.createElement('option'); o.textContent = val;
        sel.insertBefore(o, addOpt);
        sel.value = val;
        toast('Opción agregada.', 'ok');
      })
      .catch(fail)
      .then(function () { sel.disabled = false; });
