<style>
  :root {
    --ink:#17302b; --slate:#4d6660; --muted:#8aa09a;
    --paper:#f3f1ea; --surface:#ffffff; --line:#e3e2d6;
    --rail:#073431; --rail-line:#0f4740; --rail-hover:#0d423c; --rail-active:#12554c;
    --primary:#073431; --primary-600:#0d4a44;
    --success:#2f7d5c; --success-bg:#e9f3ed;
    --danger:#a5473f; --danger-bg:#f6ece9;
    --radius:10px;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.5; }

  #loginView { min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:var(--rail); color:#fff; padding:24px; }
  #loginView img.logo { width:280px; max-width:72vw; margin-bottom:34px; }
  .login-card { width:100%; max-width:360px; background:var(--surface); color:var(--ink);
    border-radius:14px; padding:26px 24px; }
  .login-card h1 { margin:0 0 18px; font-size:16px; font-weight:600; }
  .login-card .fld { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .login-card label { font-size:13px; color:var(--slate); font-weight:600; }
  .login-card input { font:inherit; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .login-card input:focus { outline:2px solid var(--ink); outline-offset:1px; border-color:var(--ink); }
  .pass-wrap { position:relative; display:flex; }
  .pass-wrap input { flex:1 1 auto; padding-right:42px; }
  .pass-toggle { position:absolute; right:6px; top:50%; transform:translateY(-50%);
    background:transparent; border:0; padding:6px; cursor:pointer; color:var(--muted);
    display:flex; align-items:center; }
  .pass-toggle:hover { color:var(--ink); border-color:transparent; }
  .pass-toggle svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .login-err { color:var(--danger); font-size:13px; min-height:18px; margin:2px 0 10px; }
  .btn-full { width:100%; justify-content:center; }

  #appView { display:none; }
  #appView.on { display:block; }

  .sidebar { position:fixed; top:0; left:0; bottom:0; width:252px; z-index:60;
    background:var(--rail); color:#fff; display:flex; flex-direction:column; overflow-y:auto;
    transform:translateX(-100%); transition:transform .22s ease; }
  #appView.nav-open .sidebar { transform:translateX(0); }
  .backdrop { position:fixed; inset:0; background:rgba(10,12,15,.45); z-index:55;
    opacity:0; visibility:hidden; transition:opacity .2s; }
  #appView.nav-open .backdrop { opacity:1; visibility:visible; }

  .sidebar .brand { display:flex; align-items:center; gap:11px; padding:16px 16px 16px 18px;
    border-bottom:1px solid var(--rail-line); }
  .sidebar .brand img { height:28px; width:auto; display:block; }
  .sidebar .brand .bw { font-family:"Cormorant Garamond",Georgia,serif; font-size:26px;
    font-weight:600; letter-spacing:6px; text-transform:uppercase; line-height:1; color:#f2eee3; }
  .sidebar .brand .bw small { display:block; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:8px; font-weight:600; letter-spacing:3px; color:#b9b19c; margin-top:3px; }
  .sidebar .brand .brandwrap { display:flex; flex-direction:column; gap:5px; }
  .sidebar .brand .brandlogo { height:26px; width:auto; display:block; }
  .sidebar .brand .brandwrap small { font-size:8px; font-weight:600; letter-spacing:3px;
    text-transform:uppercase; color:#9db8ac; }
  .sidebar .brand .close { margin-left:auto; background:transparent; border:0; color:#8b929b;
    cursor:pointer; padding:4px; display:flex; }
  .sidebar .brand .close svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; }
  .sidebar .nav-title { font-size:11px; letter-spacing:1.5px; text-transform:uppercase;
    color:#6f7681; padding:16px 18px 8px; }
  .sidebar nav { padding-bottom:16px; }

  .nav-item { display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:transparent; border:0; border-left:3px solid transparent; border-radius:0;
    padding:10px 15px; font-size:14px; font-weight:500; color:#c3c8d0; cursor:pointer; }
  .nav-item:hover { background:var(--rail-hover); color:#fff; }
  .nav-item.active { background:var(--rail-active); color:#fff; border-left-color:#fff; }
  .nav-item svg { width:18px; height:18px; flex:0 0 18px; fill:none;
    stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .nav-label { flex:1 1 auto; }
  .nav-item .chev { width:15px; height:15px; flex:0 0 15px; color:#7f8894; transition:transform .15s; }
  .nav-group.open .nav-grouphead .chev { transform:rotate(90deg); }
  .nav-group.open .nav-grouphead { color:#fff; background:var(--rail-hover); }
  .nav-sub { display:none; }
  .nav-group.open .nav-sub { display:block; }
  .nav-child { padding-left:46px; color:#9aa0a8; }
  .nav-child:hover { color:#fff; }
  .nav-child.active { color:#fff; background:var(--rail-active); border-left-color:#fff; }
  .nav-sub .nav-sub .nav-item { padding-left:64px; font-size:13px; }

  .main { min-height:100vh; display:flex; flex-direction:column; }
  .topbar { background:var(--surface); border-bottom:1px solid var(--line);
    padding:12px 20px; display:flex; align-items:center; gap:13px; }
  .hamburger { display:flex; align-items:center; justify-content:center; background:var(--surface);
    border:1px solid var(--line); border-radius:8px; width:38px; height:38px; padding:0; cursor:pointer; color:var(--ink); }
  .hamburger:hover { border-color:#cfd4db; }
  .hamburger svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; }
  .topbar .area { font-size:18px; font-weight:600; letter-spacing:-0.2px; }
  .topbar .userbox { margin-left:auto; display:flex; align-items:center; gap:12px; }
  .topbar .hello { font-size:13px; color:var(--slate); }
  .topbar .logout { background:var(--surface); color:var(--ink); border:1px solid var(--line);
    padding:6px 12px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; }
  .topbar .logout:hover { border-color:#cfd4db; }

  .content { padding:24px; width:100%; }

  @media (max-width:520px) {
    .sidebar { width:82vw; max-width:290px; }
    .content { padding:16px; }
    .topbar { padding:12px 14px; }
    .topbar .hello { display:none; }
  }

  .controls { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin:22px 0 14px; }

  /* --- Filtros --- */
  .filterbar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:10px; position:relative; }
  .chip { display:inline-flex; align-items:center; gap:8px; background:#eef0f3; border:1px solid var(--line);
    border-radius:999px; padding:5px 10px 5px 12px; font-size:13px; color:var(--ink); }
  .chip b { font-weight:600; }
  .chip .x { cursor:pointer; color:var(--muted); font-weight:700; line-height:1; padding:0 2px; }
  .chip .x:hover { color:var(--danger); }
  .nofilters { font-size:13px; color:var(--muted); }
  .filter-pop { position:absolute; top:100%; left:0; z-index:40; margin-top:6px; width:340px; max-width:92vw;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    box-shadow:0 8px 28px rgba(20,25,40,.12); padding:14px; box-sizing:border-box; }
  .filter-pop h4 { margin:0 0 8px; font-size:13px; color:var(--slate); font-weight:600; }
  .filter-pop select, .filter-pop input { width:100%; font:inherit; border:1px solid var(--line);
    border-radius:8px; padding:7px 9px; margin-bottom:8px; box-sizing:border-box; }
  .filter-values { max-height:200px; overflow-y:auto; border:1px solid var(--line); border-radius:8px; padding:4px; margin-bottom:10px; }
  .filter-values label { display:flex; align-items:flex-start; gap:8px; font-size:13px; line-height:1.35;
    padding:6px 8px; cursor:pointer; border-radius:6px; text-align:left; }
  .filter-values label:hover { background:#f4f5f7; }
  .filter-values input[type=checkbox] { flex:0 0 auto; width:15px; height:15px; margin:1px 0 0; }
  .filter-values label span { flex:1 1 auto; min-width:0; word-break:break-word; }
  .fv-tools { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .fv-tools input { margin-bottom:0; }
  .fv-tools button { padding:6px 10px; font-size:12px; white-space:nowrap; }
  .fv-empty { font-size:13px; color:var(--muted); padding:8px; }
  .filter-range { display:flex; align-items:center; gap:6px; margin-bottom:10px; }
  .filter-range input { margin-bottom:0; min-width:0; flex:1 1 0; }
  .filter-range span { flex:0 0 auto; color:var(--muted); }
  .filter-actions { display:flex; gap:8px; justify-content:flex-end; }
  .filter-actions button { padding:6px 12px; font-size:13px; }

  /* --- Tarjetas de resumen --- */
  .summary { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:16px; }
  .sum-card { background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:12px 16px; min-width:150px; text-align:center; }
  .sum-card .k { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
  .sum-card .v { font-size:20px; font-weight:600; letter-spacing:-0.4px; margin-top:2px; font-variant-numeric:tabular-nums; }

  /* ---------- Inicio ---------- */
  #homeView { display:none; }
  .hero { margin-bottom:26px; }
  .hero h2 { margin:0; font-size:26px; font-weight:600; letter-spacing:-0.6px; }
  .hero p { margin:4px 0 0; color:var(--muted); font-size:14px; }

  .quick-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:28px; }
  .quick-card { display:flex; align-items:center; gap:12px; background:var(--surface);
    border:1px solid var(--line); border-radius:12px; padding:16px; cursor:pointer; text-align:left;
    font:inherit; color:var(--ink); transition:border-color .12s, transform .12s; }
  .quick-card:hover { border-color:#c8ccd2; transform:translateY(-1px); }
  .quick-card svg { width:22px; height:22px; flex:0 0 22px; fill:none; stroke:currentColor;
    stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; color:var(--slate); }
  .quick-card .qt { font-size:14px; font-weight:600; }
  .quick-card .qs { font-size:12px; color:var(--muted); margin-top:1px; }

  .alert-list { display:flex; flex-direction:column; gap:10px; }
  .alert { display:flex; align-items:center; gap:14px; background:var(--surface);
    border:1px solid var(--line); border-left:3px solid var(--muted); border-radius:10px; padding:14px 16px; }
  .alert.warn { border-left-color:#d99a2b; }
  .alert.info { border-left-color:var(--slate); }
  .alert .an { font-size:22px; font-weight:600; min-width:52px; font-variant-numeric:tabular-nums; }
  .alert .ab { flex:1 1 auto; min-width:0; }
  .alert .at { font-size:14px; font-weight:600; }
  .alert .ad { font-size:13px; color:var(--muted); margin-top:1px; }
  .alert button { padding:6px 12px; font-size:13px; white-space:nowrap; }
  .all-good { background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:22px; text-align:center; color:var(--muted); font-size:14px; }

  /* ---------- Dashboard ---------- */
  #dashView { display:none; }
  .dash-bar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:22px; }
  .dash-bar .lb { font-size:13px; color:var(--slate); font-weight:600; }
  .dash-bar input[type=date] { font:inherit; border:1px solid var(--line); border-radius:8px;
    padding:7px 9px; background:var(--surface); color:var(--ink); }
  .dash-bar input:focus { outline:2px solid var(--ink); outline-offset:1px; border-color:var(--ink); }
  .dash-bar .quick { display:flex; gap:6px; margin-left:auto; flex-wrap:wrap; }
  .dash-bar .quick button { padding:6px 11px; font-size:13px; }
  .dash-bar .quick button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .dash-section { margin-bottom:28px; }
  .dash-section > h3 { margin:0 0 12px; font-size:13px; font-weight:600; color:var(--slate);
    text-transform:uppercase; letter-spacing:1px; }
  .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  .kpi { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; min-width:0; }
  .kpi .k { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
  .kpi .v { font-size:24px; font-weight:600; letter-spacing:-0.6px; margin-top:4px;
    font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .kpi .s { font-size:12px; color:var(--muted); margin-top:2px; }

  /* Filtro de fechas del dashboard */
  .dash-filter { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:22px; }
  .dash-filter label { font-size:13px; font-weight:600; color:var(--slate); }
  .dash-filter input[type=date] { font:inherit; border:1px solid var(--line); border-radius:8px;
    padding:7px 10px; background:var(--surface); color:var(--ink); }
  .dash-filter input:focus { outline:2px solid var(--ink); outline-offset:1px; border-color:var(--ink); }
  .dash-filter span { color:var(--muted); }
  .dash-filter button { padding:7px 14px; font-size:13px; }
  .dash-filter .dash-hint { font-size:12px; color:var(--muted); margin-left:4px; }
  .kpi.dark { background:var(--rail); border-color:var(--rail); }
  .kpi.dark .k { color:#8b929b; }
  .kpi.dark .v { color:#fff; }
  .kpi.dark .s { color:#8b929b; }

  .dash-cols { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:18px; }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .panel > h4 { margin:0; padding:14px 16px; border-bottom:1px solid var(--line);
    font-size:14px; font-weight:600; }
  .panel-body { padding:16px; }

  /* Barras horizontales */
  .bars { display:flex; flex-direction:column; gap:10px; }
  .bar-row { display:grid; grid-template-columns:130px 1fr auto; align-items:center; gap:10px; font-size:13px; }
  .bar-row .lbl { color:var(--slate); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track { background:#eef0f3; border-radius:999px; height:9px; overflow:hidden; display:block; width:100%; }
  .bar-fill { background:var(--ink); height:9px; border-radius:999px; display:block; }
  .bar-row .val { color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; min-width:64px; text-align:right; }

  /* Columnas verticales (serie mensual) */
  .chart { display:flex; align-items:flex-end; gap:6px; height:170px; padding-top:8px; }
  .chart .cbar { flex:1 1 0; display:flex; flex-direction:column; justify-content:flex-end;
    align-items:center; gap:6px; min-width:0; }
  .chart .cbar .fill { width:100%; background:var(--ink); border-radius:5px 5px 0 0; min-height:2px; }
  .chart .cbar .cl { font-size:10px; color:var(--muted); white-space:nowrap; }
  .chart .cbar .cv { font-size:9px; color:var(--slate); font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .bar-total { display:flex; justify-content:space-between; align-items:center; gap:10px;
    border-top:1px solid var(--line); margin-top:12px; padding-top:10px;
    font-size:13px; font-weight:600; }
  .bar-total .tv { font-variant-numeric:tabular-nums; }
  .chart .cbar:hover .fill { background:#3c424a; }

  .mini-table { width:100%; border-collapse:collapse; font-size:13px; table-layout:auto; }
  .mini-table th, .mini-table td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px; width:auto; }
  .mini-table th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase;
    letter-spacing:.5px; background:transparent; position:static; text-align:left; }
  .mini-table td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .dash-empty { color:var(--muted); font-size:13px; padding:8px 0; }
  input[type=text], input[type=search] { font:inherit; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  input:focus { outline:2px solid var(--ink); outline-offset:1px; border-color:var(--ink); }
  .count { margin-left:auto; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }

  button { font:inherit; font-weight:600; cursor:pointer; border-radius:8px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:8px 14px; transition:background .12s, border-color .12s; }
  button:hover { border-color:#cfd4db; }
  button.primary { background:var(--primary); border-color:var(--primary); color:#fff; }
  button.primary:hover { background:var(--primary-600); border-color:var(--primary-600); }
  button:disabled { opacity:.55; cursor:default; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  .card + .card { margin-top:22px; }
  .card-head { padding:14px 16px; border-bottom:1px solid var(--line); font-weight:600; font-size:15px; }
  .card-body { padding:16px; }

  .table-scroll { overflow-x:auto; scrollbar-width:thin; scrollbar-color:#c4c9d0 #eef0f3; -webkit-overflow-scrolling:touch; }
  .table-scroll::-webkit-scrollbar { height:11px; }
  .table-scroll::-webkit-scrollbar-track { background:#eef0f3; }
  .table-scroll::-webkit-scrollbar-thumb { background:#c4c9d0; border-radius:6px; border:2px solid #eef0f3; }
  .table-scroll::-webkit-scrollbar-thumb:hover { background:#aab0b8; }
  table { border-collapse:collapse; font-size:14px; table-layout:fixed; width:auto; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap; width:220px; box-sizing:border-box; overflow:hidden; text-overflow:ellipsis; }
  th { color:var(--slate); font-weight:600; background:#fafbfc; position:sticky; top:0; text-align:center; }
  th.sortable { cursor:pointer; user-select:none; }
  th.sortable:hover { color:var(--ink); }
  .ta-center { text-align:center; }
  .ta-center input { text-align:center; }
  .ta-right { text-align:right; }
  .ta-right input { text-align:right; }
  tbody tr:hover { background:#f6f7f9; }
  td.actions { white-space:nowrap; }
  .row-input { font:inherit; width:100%; min-width:110px; border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  .edit-btn, .save-btn, .cancel-btn { padding:5px 10px; font-size:13px; }
  .cancel-btn { margin-left:6px; }

  .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; }
  .form-grid .fld { display:flex; flex-direction:column; gap:5px; }
  .form-grid label { font-size:13px; color:var(--slate); font-weight:600; }
  .form-grid input, .form-grid select { font:inherit; border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--surface); color:var(--ink); width:100%; }
  .form-grid input:focus, .form-grid select:focus { outline:2px solid var(--ink); outline-offset:1px; border-color:var(--ink); }
  .form-grid input[readonly] { background:#cfc9bb; color:#3f3b33; border-color:#bdb6a5; cursor:not-allowed; }
  .form-grid input[readonly]:focus { outline:none; border-color:#bdb6a5; }
  .form-actions { margin-top:16px; display:flex; gap:10px; align-items:center; }

  .state { padding:28px 16px; text-align:center; color:var(--muted); font-size:14px; }

  .toast { position:fixed; right:20px; bottom:20px; max-width:340px;
    padding:12px 16px; border-radius:8px; font-size:14px; font-weight:500;
    box-shadow:0 6px 24px rgba(20,25,40,.14); opacity:0; transform:translateY(8px);
    transition:opacity .18s, transform .18s; pointer-events:none; z-index:70; }
  .toast.show { opacity:1; transform:translateY(0); }
  .toast.ok  { background:var(--success-bg); color:var(--success); border:1px solid #bfe6d5; }
  .toast.err { background:var(--danger-bg);  color:var(--danger);  border:1px solid #f0c9c9; }
</style>
</head>

      <div class="controls">
        <input type="search" id="search" placeholder="Buscar en la tabla..." style="min-width:220px">
        <button id="filterBtn" type="button">Añadir filtro</button>
        <button id="refreshBtn" type="button">Actualizar</button>
        <button id="downloadBtn" type="button">Descargar</button>
        <span class="count" id="count"></span>
      </div>
      <div class="filterbar" id="filterBar"></div>
      <div class="summary" id="summary"></div>
      <section class="card">
        <div class="card-head">Registros</div>
        <div id="tableWrap" class="table-scroll"><div class="state">Cargando...</div></div>
      </section>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  var ICONS = {
    home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
    grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
    cart:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>',
    factory:'<path d="M2 20h20"/><path d="M4 20V10l5 3V10l5 3V7l5 3v10"/>',
    box:'<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3.3 7L12 12l8.7-5"/><path d="M12 22V12"/>',
    tag:'<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>',
    dollar:'<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
    book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
    card:'<rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/>',
    users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    briefcase:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
    layers:'<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>',
    tool:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>'
  };
  function icon(name){ return '<svg viewBox="0 0 24 24">' + (ICONS[name]||'') + '</svg>'; }
  function chev(){ return '<svg class="chev" viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>'; }

  // Llama a una función serverless en /api/*
  async function api(path, body) {
    const res = await fetch('/api/' + path, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    });
    const data = await res.json().catch(function(){ return {}; });
    if (!res.ok) throw new Error(data.error || ('Error ' + res.status));
    return data;
  }

  var state = { token:null, key:null, label:'', headers:[], rows:[], categories:{}, lookups:[], rol:'' };

  // Áreas de solo consulta: sin formulario "Agregar registro"
  var READ_ONLY_AREAS = ['ingresos', 'egresos', 'cxc'];
  function esLector() {
    return state.rol === 'lector' || state.rol === 'viewer' || state.rol === 'lectura';
  }
  function esSoloLectura(key) { return esLector() || READ_ONLY_AREAS.indexOf(key) !== -1; }
  var appEl = function(){ return document.getElementById('appView'); };
  function closeNav(){ appEl().classList.remove('nav-open'); }
  function toggleNav(){ appEl().classList.toggle('nav-open'); }

  function toast(msg, kind) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast show ' + (kind || 'ok');
    setTimeout(function () { t.className = 'toast ' + (kind || 'ok'); }, 3200);
  }
  function esc(v) { return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function isDateCol(h) { var s = String(h).toLowerCase();
    return s.indexOf('fecha') !== -1 || s.indexOf('vencimiento') !== -1; }

  function doLogin() {
    var u = document.getElementById('user').value.trim();
    var p = document.getElementById('pass').value;
    var err = document.getElementById('loginErr'); err.textContent = '';
    if (!u || !p) { err.textContent = 'Completá usuario y contraseña.'; return; }
    var btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'Entrando...';
    api('login', { usuario:u, contrasena:p }).then(function (res) {
      if (res && res.ok) {
        state.token = res.token;
        state.rol = String(res.rol || '').trim().toLowerCase();
        document.getElementById('hello').textContent = 'Hola, ' + (res.nombre || u);
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('pass').value = '';
        appEl().classList.add('on');
        buildMenu();
      } else { err.textContent = (res && res.error) || 'No se pudo iniciar sesión.'; }
    }).catch(function (e) { err.textContent = (e && e.message) || 'Error de conexión.'; })
      .then(function () { btn.disabled = false; btn.textContent = 'Entrar'; });
  }

  function doLogout() {
    state.token = null; closeNav();
    appEl().classList.remove('on');
    document.getElementById('loginView').style.display = 'flex';
    document.getElementById('user').value = '';
    document.getElementById('user').focus();
  }

  function buildMenu() {
    api('menu', { token: state.token }).then(function (res) {
      var nav = document.getElementById('navMenu'); nav.innerHTML = '';

      // Construye el menú a cualquier profundidad.
      // Un ítem puede ser área (clickeable) y grupo (desplegable) a la vez.
      function build(items, container, depth) {
        items.forEach(function (m) {
          LABELS[m.key] = m.label;
          var hasKids = m.children && m.children.length;
          if (hasKids) {
            var g = document.createElement('div'); g.className = 'nav-group';
            var head = document.createElement('button');
            head.className = 'nav-item nav-grouphead' + (depth > 0 ? ' nav-child' : '');
            head.innerHTML = (depth === 0 ? icon(m.icon) : '') +
                             '<span class="nav-label">' + m.label + '</span>' + chev();
            head.setAttribute('data-key', m.key);
            var sub = document.createElement('div'); sub.className = 'nav-sub';
            build(m.children, sub, depth + 1);
            head.addEventListener('click', function (e) {
              var chevEl = head.querySelector('.chev');
              var onChev = chevEl && chevEl.contains(e.target);
              // Si el grupo también es un área, al tocar el texto se abre el área.
              if (m.isArea && !onChev) { selectArea(m.key, m.label); g.classList.add('open'); }
              else g.classList.toggle('open');
            });
            g.appendChild(head); g.appendChild(sub); container.appendChild(g);
          } else {
            var b = document.createElement('button');
            b.className = 'nav-item' + (depth > 0 ? ' nav-child' : '');
            b.innerHTML = (depth === 0 ? icon(m.icon) : '') +
                          '<span class="nav-label">' + m.label + '</span>';
            b.setAttribute('data-key', m.key);
            b.addEventListener('click', function () { selectArea(m.key, m.label); });
            container.appendChild(b);
          }
        });
      }
      build(res.items || [], nav, 0);

      if (res.defaultKey) selectArea(res.defaultKey, res.defaultLabel, true);
    }).catch(fail);
  }

  function selectArea(key, label, keepClosed) {
    state.key = key; state.label = label;
    sortState = { col: null, dir: 1 }; editingRow = -1;
    filters = []; pendingAutoFilter = true; closeFilterPopup(); renderFilterBar();
    document.getElementById('areaTitle').textContent = label;
    var items = document.querySelectorAll('.nav-item');
    items.forEach(function (i) { i.classList.toggle('active', i.getAttribute('data-key') === key); });
    var active = document.querySelector('.nav-item.active');
    if (active) {
      var grp = active.closest('.nav-group');
      while (grp) { grp.classList.add('open'); grp = grp.parentElement.closest('.nav-group'); }
    }
    if (!keepClosed) closeNav();

    // Vistas especiales: Inicio y Dashboard tienen su propia pantalla
    var esDash = (key === 'dashboard');
    var esHome = (key === 'inicio');
    var esEspecial = esDash || esHome;
    document.getElementById('homeView').style.display = esHome ? 'block' : 'none';
    document.getElementById('dashView').style.display = esDash ? 'block' : 'none';
    document.getElementById('tableView').style.display = esEspecial ? 'none' : 'block';
    document.querySelector('.controls').style.display = esEspecial ? 'none' : 'flex';
    document.getElementById('filterBar').style.display = esEspecial ? 'none' : 'flex';
    document.getElementById('summary').style.display = esEspecial ? 'none' : 'flex';
    if (esHome) { loadHome(); return; }
    if (esDash) { loadDashboard(); return; }

    loadArea();
  }

  function loadArea() {
    document.getElementById('tableWrap').innerHTML = '<div class="state">Cargando...</div>';
    document.getElementById('count').textContent = '';
    state.categories = {}; state.lookups = [];
    Promise.all([
      api('data', { token: state.token, key: state.key }),
      api('categories', { token: state.token, key: state.key }).catch(function () { return {}; }),
      api('lookup', { token: state.token, key: state.key }).catch(function () { return null; })
    ]).then(function (r) {
      var data = r[0]; state.categories = r[1] || {};
      var lk = r[2]; state.lookups = (lk && lk.lookups) ? lk.lookups : [];
      state.headers = data.headers || []; state.rows = data.rows || [];
      if (!data.connected) {
        document.getElementById('tableWrap').innerHTML =
          '<div class="state">Esta área todavía no está conectada. Agregá su hoja en SHEETS (lib/core.js).</div>';
        document.getElementById('addCard').style.display = 'none';
        document.getElementById('formFields').innerHTML = '';
      } else if (!state.headers.length) {
        document.getElementById('tableWrap').innerHTML =
          '<div class="state">La hoja está vacía o no tiene encabezados en la fila 1.</div>';
        document.getElementById('addCard').style.display = 'none';
        document.getElementById('formFields').innerHTML = '';
      } else {
        if (pendingAutoFilter) { pendingAutoFilter = false; aplicarFiltroAnual(); }
        document.getElementById('addCard').style.display = esSoloLectura(state.key) ? 'none' : '';
        renderFilterBar();
        renderTable();
        if (!esSoloLectura(state.key)) renderForm();
      }
    }).catch(fail);
  }

  var sortState = { col: null, dir: 1 };
  function parseNumber(v) {
    var s = String(v == null ? '' : v).trim();
    if (s === '') return null;
    s = s.replace(/[^0-9.,\-]/g, '').replace(/,/g, '');
    if (s === '' || s === '-' || s === '.') return null;
    var n = parseFloat(s);
    return isNaN(n) ? null : n;
  }

  // Columnas que se muestran como dinero ($ y separador de miles). Se comparan sin distinguir espacios/mayúsculas.
  var MONEY_FIELDS = ['Descuento','Subtotal','IVA','Total','Total Cobrado','Por Cobrar','Saldo','Monto','Importe','Precio',
                      'Salario Bruto Mensual','Salario Neto Mensual','SD','SDI','SBC',
                      'Cuentas por Cobrar','Cuentas por Pagar','Ingreso','Egreso','Cargo','Abono','Depósito','Retiro'];
  // Columnas de dinero que NO se suman en las tarjetas (solo se formatean)
  var NO_SUM_FIELDS = ['SD','SDI','SBC'];
  function isSummable(h) {
    return isMoneyCol(h) && !NO_SUM_FIELDS.some(function (n) { return norm(n) === norm(h); });
  }
  // Ancho máximo especial por columna (px). Las demás usan 220px (regla th,td).
  var WIDTH_FIELDS = { 'comentarios': 440, 'status': 120, 'no. identificacion': 120, 'no. de identificacion': 120,
                       'fecha': 150, 'codigo': 150, 'expediente': 150, 'fecha de contrato': 150,
                       '# de integrantes': 150, 'fecha de nacimiento': 150,
                       'unidades': 150, 'moneda': 150, 'tipo de cambio': 150, '% de comision': 150,
                       'no. de cliente': 150, 'canal de compra': 150, 'comision compra': 150,
                       'otros gastos': 150 };
  function colWidth(h) { return WIDTH_FIELDS[norm(h)] || null; }
  // Columnas que se muestran centradas (por nombre; tolera espacios/acentos/mayúsculas).
  var CENTER_FIELDS = ['Status', 'No. Identificación', 'No. de Identificación', 'Fecha',
                       'RFC', 'Código Postal', 'Banco', 'Dias de Crédito', 'Días de Crédito',
                       'Código', 'Expediente', 'Fecha de contrato', '# de integrantes', 'Fecha de nacimiento',
                       'Tipo de membresia',
                       'Unidades', 'Moneda', 'Tipo de Cambio', '% de Comisión', 'Margen Bruto',
                       'No. de Cliente', 'Canal de Compra'];
  function isCenterCol(h) {
    var s = norm(h);
    return CENTER_FIELDS.some(function (c) { return norm(c) === s; });
  }
  function isMoneyCol(h) {
    var s = norm(h);
    return MONEY_FIELDS.some(function (m) { return norm(m) === s; });
  }
  // Columnas alineadas a la derecha (sin formatear como dinero ni sumar en tarjetas).
  var RIGHT_FIELDS = ['Total', 'Total USD', 'Costo Total USD', 'Utilidad Bruta', 'Comisión',
                      'Comision Compra', 'Otros Gastos'];
  function isRightCol(h) {
    var s = norm(h);
    return RIGHT_FIELDS.some(function (c) { return norm(c) === s; });
  }
  function formatMoney(v) {
    var n = parseNumber(v);
    if (n === null) return String(v == null ? '' : v);
    var neg = n < 0; n = Math.abs(n);
    var parts = n.toFixed(2).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + '$' + parts[0] + '.' + parts[1];
  }
  var MESES = { enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12,
    ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,set:9,oct:10,nov:11,dic:12 };
  function parseDate(v) {
    var s = String(v == null ? '' : v).trim().toLowerCase();
    if (s === '') return null;
    var m;
    m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);
    if (m) return (+m[1]) * 10000 + (+m[2]) * 100 + (+m[3]);
    m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
    if (m) return (+m[3]) * 10000 + (+m[2]) * 100 + (+m[1]);
    m = s.match(/^(\d{1,2})\s+(?:de\s+)?([a-záéíóú]+)\.?\s+(?:de\s+)?(\d{4})$/);
    if (m && MESES[m[2]]) return (+m[3]) * 10000 + MESES[m[2]] * 100 + (+m[1]);
    return null;
  }
  function cellKind(v) {
    var s = String(v == null ? '' : v).trim();
    if (s === '') return 'empty';
    if (parseDate(s) !== null) return 'date';
    if (parseNumber(s) !== null && !/[a-z]{2,}/i.test(s)) return 'number';
    return 'text';
  }
  function columnType(h) {
    var d = 0, n = 0, total = 0, lim = Math.min(state.rows.length, 60);
    for (var i = 0; i < lim; i++) {
      var k = cellKind(state.rows[i][h]);
      if (k === 'empty') continue;
      total++;
      if (k === 'date') d++; else if (k === 'number') n++;
    }
    if (total === 0) return 'text';
    if (d / total >= 0.6) return 'date';
    if (n / total >= 0.7) return 'number';
    return 'text';
  }
  function sortRows(rows) {
    if (sortState.col === null) return rows;
    var h = sortState.col, dir = sortState.dir, type = columnType(h);
    return rows.slice().sort(function (a, b) {
      var va = a[h], vb = b[h];
      var ea = (va == null || String(va).trim() === ''), eb = (vb == null || String(vb).trim() === '');
      if (ea && eb) return 0; if (ea) return 1; if (eb) return -1;
      var cmp;
      if (type === 'number') cmp = (parseNumber(va) || 0) - (parseNumber(vb) || 0);
      else if (type === 'date') cmp = (parseDate(va) || 0) - (parseDate(vb) || 0);
      else cmp = String(va).localeCompare(String(vb), 'es', { numeric: true, sensitivity: 'base' });
      return cmp * dir;
    });
  }

  // ===== Filtros =====
  var filters = [];   // {col, type:'values'|'range', values:[], from:'', to:''}

  // Áreas que arrancan con filtro de fecha del año en curso (columna a usar).
  var AUTO_DATE_FILTER = {
    ventas_registro: 'Fecha',
    compras_registro: 'Fecha',
    rrhh_incidencias: 'Fecha',
    cli_membresias: 'Fecha de contrato',
    ingresos: 'Fecha',
    egresos: 'Fecha'
  };
  var pendingAutoFilter = false;
  function aplicarFiltroAnual() {
    var nombre = AUTO_DATE_FILTER[state.key];
    if (!nombre) return;
    var col = state.headers.filter(function (x) { return norm(x) === norm(nombre); })[0];
    if (!col) {
      // Respaldo: primera columna que parezca de fecha
      col = state.headers.filter(function (x) { return norm(x).indexOf('fecha') === 0; })[0];
    }
    if (!col) return;
    filters.push({ col: col, type: 'range', from: isoInicioAnio(), to: isoHoy() });
  }

  // Columnas filtrables por área. Si un área no está aquí, se pueden filtrar todas.
  var FILTER_FIELDS = {
    ventas_registro: ['Fecha', 'Cliente', 'Categoría', 'Colección', 'Canal de Venta', 'Método de Pago', 'Vendedor'],
    proyectos_registro: ['Fecha', 'Cliente', 'Tipo', 'Estatus', 'Responsable'],
    prod_ordenes: ['Fecha', 'Estatus', 'Responsable', 'Proyecto'],
    cli_membresias: ['Tipo de membresia'],
    cli_pit: [],            // sin filtros útiles
    cli_corporativos: [],   // sin filtros útiles
    compras_proveedores: ['Status', 'Categoría', 'Régimen fiscal', 'Términos de pago'],
    rrhh_incidencias: ['Fecha', 'Colaborador', 'Puesto', 'Área', 'Departamento', 'Inicdencia', 'Incidencia'],
    rrhh_colaboradores: ['Status', 'Sexo', 'Fecha de Inicio de Rel Laboral', 'Fecha de baja',
                         'Tipo de empleado', 'Régimen de pago', 'Periodicidad de pago',
                         'Tipo de Contrato', 'Puesto', 'Área', 'Departamento']
  };
  function filterableHeaders() {
    var allow = FILTER_FIELDS[state.key];
    if (allow === undefined) return state.headers;   // no configurada: todas
    if (!allow.length) return [];                     // configurada sin filtros: ninguna
    return state.headers.filter(function (h) {
      return allow.some(function (a) { return norm(a) === norm(h); });
    });
  }

  function dateColumns() {
    return state.headers.filter(function (h) { return columnType(h) === 'date'; });
  }
  function distinctValues(col) {
    var seen = {}, out = [];
    state.rows.forEach(function (r) {
      var v = String(r[col] == null ? '' : r[col]).trim();
      if (v && !seen[v]) { seen[v] = 1; out.push(v); }
    });
    out.sort(function (a, b) { return a.localeCompare(b, 'es', { numeric: true }); });
    return out;
  }
  function passesFilters(r) {
    return filters.every(function (f) {
      var v = r[f.col];
      if (f.type === 'values') {
        return f.values.indexOf(String(v == null ? '' : v).trim()) !== -1;
      }
      var d = parseDate(v);
      if (d === null) return false;
      if (f.from) { var df = parseInt(f.from.replace(/-/g, ''), 10); if (d < df) return false; }
      if (f.to)   { var dt = parseInt(f.to.replace(/-/g, ''), 10);   if (d > dt) return false; }
      return true;
    });
  }
  function renderFilterBar() {
    var bar = document.getElementById('filterBar');
    var canFilter = filterableHeaders().length > 0;
    document.getElementById('filterBtn').style.display = canFilter ? '' : 'none';
    if (!canFilter) { bar.innerHTML = ''; return; }
    if (!filters.length) { bar.innerHTML = '<span class="nofilters">No hay filtros seleccionados</span>'; return; }
    var html = '';
    filters.forEach(function (f, i) {
      var desc = (f.type === 'values')
        ? (f.values.length > 2 ? f.values.length + ' seleccionados' : f.values.join(', '))
        : ((f.from ? isoToLargo(f.from) : '…') + ' → ' + (f.to ? isoToLargo(f.to) : '…'));
      html += '<span class="chip"><b>' + esc(String(f.col).trim()) + ':</b> ' + esc(desc) +
              '<span class="x" data-i="' + i + '">×</span></span>';
    });
    html += '<button id="clearFiltersBtn" type="button" style="padding:5px 10px;font-size:13px">Quitar todos</button>';
    bar.innerHTML = html;
  }
  function openFilterPopup() {
    var bar = document.getElementById('filterBar');
    if (document.getElementById('filterPop')) { closeFilterPopup(); return; }
    var cols = filterableHeaders();
    if (!cols.length) { toast('No hay columnas filtrables en esta área.', 'err'); return; }
    var pop = document.createElement('div');
    pop.className = 'filter-pop'; pop.id = 'filterPop';
    var opts = cols.map(function (h) {
      return '<option value="' + esc(h).replace(/"/g, '&quot;') + '">' + esc(String(h).trim()) + '</option>';
    }).join('');
    pop.innerHTML = '<h4>Filtrar por columna</h4>' +
      '<select id="fCol">' + opts + '</select>' +
      '<div id="fBody"></div>' +
      '<div class="filter-actions"><button id="fCancel" type="button">Cancelar</button>' +
      '<button class="primary" id="fApply" type="button">Aplicar</button></div>';
    bar.appendChild(pop);
    document.getElementById('fCol').addEventListener('change', renderFilterBody);
    document.getElementById('fCancel').addEventListener('click', closeFilterPopup);
    document.getElementById('fApply').addEventListener('click', applyFilterFromPopup);
    renderFilterBody();
  }
  function closeFilterPopup() {
    var p = document.getElementById('filterPop'); if (p) p.remove();
  }
  function renderFilterBody() {
    var col = document.getElementById('fCol').value;
    var body = document.getElementById('fBody');
    if (columnType(col) === 'date') {
      body.innerHTML = '<h4>Rango de fechas</h4><div class="filter-range">' +

  // ===== Resumen =====
  // Columnas de dinero que NO se muestran como tarjeta en ciertas áreas.
  var SUMMARY_EXCLUDE = {

  function excluidaDeResumen(h2) {

  }

  // Columna que se desglosa en tarjetas de conteo (una por cada valor). Por área.
  var BREAKDOWN_FIELDS = {

  function breakdownCol() {
    var name = BREAKDOWN_FIELDS[state.key] || 'Status';   // por defecto, Status
    return state.headers.filter(function (h) { return norm(h) === norm(name); })[0];

  // Tarjetas de resumen personalizadas por área. Si un área está aquí, se muestran
  // Registros + estas tarjetas (en vez del auto-resumen de columnas de dinero).
  // type:'sum' suma una columna; type:'ratio' = sum(num)/sum(den) (percent:true -> %).
  var SUMMARY_CARDS = {
    ventas_registro: [
      { k: 'Total USD',       type: 'sum',   field: 'Total USD' },
      { k: 'Costo Total USD', type: 'sum',   field: 'Costo Total USD' },
      { k: 'Utilidad Bruta',  type: 'sum',   field: 'Utilidad Bruta' },
      { k: 'Margen Bruto',    type: 'ratio', num: 'Utilidad Bruta', den: 'Total USD', percent: true }
    ],
    compras_registro: [
      { k: 'Total USD',       type: 'sum', field: 'Total USD' },
      { k: 'Comision Compra', type: 'sum', field: 'Comision Compra' },
      { k: 'Otros Gastos',    type: 'sum', field: 'Otros Gastos' },
      { k: 'Costo Total USD', type: 'sum', field: 'Costo Total USD' }

  function renderSummary(rows) {
    var box = document.getElementById('summary');
    if (!state.headers.length) { box.innerHTML = ''; return; }
    var html = '<div class="sum-card"><div class="k">Registros</div><div class="v">' +
               rows.length.toLocaleString('es-MX') + '</div></div>';

    // Config de tarjetas por área (si existe, manda)
    var custom = SUMMARY_CARDS[state.key];
    if (custom) {
      custom.forEach(function (c) {
        if (c.type === 'sum') {
          var real = findHeaderByName(c.field);
          var sum = 0;
          rows.forEach(function (r) { var n = parseNumber(real ? r[real] : null); if (n !== null) sum += n; });
          html += '<div class="sum-card"><div class="k">' + esc(c.k) + '</div><div class="v">' +
                  esc(formatMoney(sum)) + '</div></div>';
        } else if (c.type === 'ratio') {
          var rn = findHeaderByName(c.num), rd = findHeaderByName(c.den);
          var sn = 0, sd = 0;
          rows.forEach(function (r) {
            var a = parseNumber(rn ? r[rn] : null); if (a !== null) sn += a;
            var b = parseNumber(rd ? r[rd] : null); if (b !== null) sd += b;
          });
          var val = sd ? (sn / sd) : 0;
          var shown = c.percent ? (val * 100).toFixed(1) + '%' : formatMoney(val);
          html += '<div class="sum-card"><div class="k">' + esc(c.k) + '</div><div class="v">' +
                  esc(shown) + '</div></div>';
        }
      });
      box.innerHTML = html;
      return;
    }

    // Una tarjeta por cada valor presente en la columna de desglose
    var bCol = breakdownCol();
    if (bCol) {
      var counts = {}, order = [];
      rows.forEach(function (r) {
        var v = String(r[bCol] == null ? '' : r[bCol]).trim();
        if (!v) return;
        if (counts[v] === undefined) { counts[v] = 0; order.push(v); }
        counts[v]++;
      });
      order.sort(function (a, b) { return counts[b] - counts[a]; }); // del más frecuente al menos
      order.forEach(function (v) {
        html += '<div class="sum-card"><div class="k">' + esc(v) + '</div><div class="v">' +
                counts[v].toLocaleString('es-MX') + '</div></div>';
      });
    }

    // Las sumas de dinero consideran solo los activos (si hay columna Status)
    var statusCol = state.headers.filter(function (h) { return norm(h) === 'status'; })[0];
    var sumRows = rows, soloActivos = false;
    if (statusCol) {
      var activos = rows.filter(function (r) {
        var v = norm(r[statusCol]);
        return v === 'activo' || v === 'activa';
      });
      if (activos.length) { sumRows = activos; soloActivos = true; }
    }

    state.headers.forEach(function (h) {
      if (!isSummable(h) || excluidaDeResumen(h)) return;
      var sum = 0, any = false;
      sumRows.forEach(function (r) {
        var n = parseNumber(r[h]); if (n !== null) { sum += n; any = true; }
      });
      if (!any) return;
      var titulo = esc(String(h).trim()) + (soloActivos ? ' (activos)' : '');
      html += '<div class="sum-card"><div class="k">' + titulo +
              '</div><div class="v">' + esc(formatMoney(sum)) + '</div></div>';
    });
    box.innerHTML = html;
  }

  var MESES_NOM = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  // Convierte 'AAAA-MM-DD' (del selector) a '15 enero 2026'
  function isoToLargo(iso) {
    var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return iso;
    return parseInt(m[3], 10) + ' ' + MESES_NOM[parseInt(m[2], 10) - 1] + ' ' + m[1];
  }
  // Muestra en la tabla cualquier fecha reconocible como '15 enero 2026'
  function formatDateCell(v) {

    var y = Math.floor(d / 10000), mo = Math.floor((d % 10000) / 100), da = d % 100;
    if (mo < 1 || mo > 12) return String(v);
    return da + ' ' + MESES_NOM[mo - 1] + ' ' + y;
  }

  // ===================== DASHBOARD =====================
  var MESES_CORTO = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var dashData = null;                       // datos crudos del servidor
  function isoHoy() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
           '-' + String(d.getDate()).padStart(2, '0');
  }
  function isoInicioAnio() { return new Date().getFullYear() + '-01-01'; }
  // Arranca filtrado del 1 de enero del año en curso a hoy (botón "Ver todo" para quitarlo)
  var dashRange = { from: isoInicioAnio(), to: isoHoy() };

  function fmtNum(n) { return (n || 0).toLocaleString('es-MX'); }
  function fmtMoneyShort(n) {
    n = n || 0;
    var neg = n < 0, a = Math.abs(n);
    var s;
    if (a >= 1000000) s = '$' + (a / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
    else if (a >= 1000) s = '$' + (a / 1000).toFixed(0) + 'k';
    else s = '$' + a.toFixed(0);
    return (neg ? '-' : '') + s;
  }
  function isoNum(s) { return s ? parseInt(String(s).replace(/-/g, ''), 10) : null; }
  function enRango(d) {
    if (d === null || d === undefined) return !dashRange.from && !dashRange.to;
    var f = isoNum(dashRange.from), t = isoNum(dashRange.to);
    if (f && d < f) return false;
    if (t && d > t) return false;
    return true;
  }
  function topN(obj, n) {
    return Object.keys(obj || {})
      .map(function (k) { return { k: k, v: obj[k] }; })
      .sort(function (a, b) { return b.v - a.v; })
      .slice(0, n || 6);
  }
  function barsHTML(obj, opts) {
    opts = opts || {};
    var items = topN(obj, opts.limit || 6);
    if (!items.length) return '<div class="dash-empty">Sin datos en el periodo.</div>';
    var granTotal = 0;
    Object.keys(obj || {}).forEach(function (k) { granTotal += obj[k] || 0; });
    var max = items[0].v || 1;
    var html = '<div class="bars">';
    items.forEach(function (it) {
      var pct = Math.max(2, Math.round((it.v / max) * 100));
      var val = opts.money ? fmtMoneyShort(it.v) : fmtNum(it.v);
      var tip = it.k + ': ' + (opts.money ? formatMoney(it.v) : fmtNum(it.v));
      html += '<div class="bar-row" title="' + esc(tip) + '">' +
        '<span class="lbl">' + esc(it.k) + '</span>' +
        '<span class="bar-track"><span class="bar-fill" style="width:' + pct + '%"></span></span>' +
        '<span class="val">' + esc(val) + '</span></div>';
    });
    html += '</div><div class="bar-total"><span>Total</span><span class="tv">' +
            esc(opts.money ? formatMoney(granTotal) : fmtNum(granTotal)) + '</span></div>';
    return html;
  }
  function chartHTML(porMes, opts) {
    opts = opts || {};
    var keys = Object.keys(porMes || {}).sort();
    if (!keys.length) return '<div class="dash-empty">Sin datos en el periodo.</div>';
    keys = keys.slice(-12);
    var max = 1;
    keys.forEach(function (k) { if (porMes[k] > max) max = porMes[k]; });
    var granTotal = 0;
    keys.forEach(function (k) { granTotal += porMes[k] || 0; });
    var html = '<div class="chart">';
    keys.forEach(function (k) {
      var v = porMes[k] || 0;
      var ht = Math.max(2, Math.round((v / max) * 128));
      var p = k.split('-');
      var lbl = MESES_CORTO[parseInt(p[1], 10) - 1] + ' ' + String(p[0]).slice(2);
      var tip = lbl + ': ' + (opts.money ? formatMoney(v) : fmtNum(v));
      var vlbl = opts.money ? fmtMoneyShort(v) : fmtNum(v);
      html += '<div class="cbar" title="' + esc(tip) + '">' +
              '<span class="cv">' + esc(vlbl) + '</span>' +

  function agrupar(rows, campo) {

    return o;

  var COMPUTED_FIELDS = {

  // Campos obligatorios por área (por nombre; tolera espacios/acentos/mayúsculas).

  function isRequiredField(h) {

  }

  }

    state.rows.forEach(function (r) {
      var v = parseInt(String(r[h] == null ? '' : r[h]).trim(), 10);
      if (!isNaN(v) && v > 0) used[v] = true;
    });
    var n = 1; while (used[n]) n++; return String(n);
  }
  function lookupFor(h) {
    var list = state.lookups || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].type === 'cascade') continue;   // la cascada se maneja aparte
      if (norm(list[i].keyField) === norm(h)) return list[i];
    }
    return null;
  }
  function isLookupKeyField(h) {
    return !!lookupFor(h);
  }
  function applyLookup(lk, value) {
    if (!lk) return;
    var rec = lk.map[value] || {};
    (lk.fills || []).forEach(function (f) {
      var real = findHeaderByName(f);
      if (!real) return;
      var el = document.querySelector('#formFields [data-col="' + real + '"]');
      if (el) el.value = rec[f] || '';
    });
    recalcComputed();
  }

  // ===== Cascada de producto (Producto -> Material -> Material 2 -> autocompleta) =====
  function cascadeLU() {
    var list = state.lookups || [];
    for (var i = 0; i < list.length; i++) if (list[i].type === 'cascade') return list[i];
    return null;
  }
  function cascadeLevelIndex(h) {
    var c = cascadeLU(); if (!c) return -1;
    for (var i = 0; i < c.levels.length; i++) if (norm(c.levels[i]) === norm(h)) return i;
    return -1;
  }
  function isCascadeFill(h) {
    var c = cascadeLU(); if (!c) return false;
    return (c.fills || []).some(function (f) { return norm(f) === norm(h); });
  }
  function closestFld(el) { while (el && !(el.classList && el.classList.contains('fld'))) el = el.parentNode; return el; }
  function cascElem(level) { return document.querySelector('#formFields [data-casc-level="' + level + '"]'); }
  function cascFillElem(name) {
    var real = findHeaderByName(name);
    return real ? document.querySelector('#formFields [data-col="' + real + '"]') : null;
  }
  function showFld(el, show) { var f = closestFld(el); if (f) f.style.display = show ? '' : 'none'; }
  function fillOptions(sel, opts) {
    var html = '<option value="">— elegir —</option>';
    opts.forEach(function (o) { html += '<option>' + esc(o) + '</option>'; });
    sel.innerHTML = html;
  }
  // Valores distintos (no vacíos) del nivel `level` entre filas que coinciden con lo elegido antes.
  function cascDistinct(c, chosen, level) {
    var seen = {}, out = [];
    c.rows.forEach(function (r) {
      for (var k = 0; k < level; k++) { if (norm(r[c.levels[k]] || '') !== norm(chosen[k] || '')) return; }
      var v = r[c.levels[level]] || '';
      if (v && !seen[norm(v)]) { seen[norm(v)] = 1; out.push(v); }
    });
    out.sort(function (a, b) { return a.localeCompare(b, 'es'); });

  }
  function onCascadeChange(level) {

    var chosen = [];
    for (var i = 0; i <= level; i++) { var el = cascElem(i); chosen.push(el ? el.value : ''); }
    // Repoblar / limpiar los niveles más profundos según lo elegido
    for (var d = level + 1; d < c.levels.length; d++) {
      var sel = cascElem(d); if (!sel) continue;
      var opts = cascDistinct(c, chosen, d);
      fillOptions(sel, opts); sel.value = '';
      showFld(sel, opts.length > 0);
      chosen[d] = '';
    }
    resolveCascadeFills();
  }
  function resolveCascadeFills() {
    var c = cascadeLU(); if (!c) return;
    var chosen = [];
    for (var i = 0; i < c.levels.length; i++) { var el = cascElem(i); chosen[i] = el ? el.value : ''; }
    var matches = c.rows.filter(function (r) {
      for (var k = 0; k < c.levels.length; k++) {
        if (chosen[k] && norm(r[c.levels[k]] || '') !== norm(chosen[k])) return false;
      }
      return true;
    });
    // ¿Falta elegir algún nivel que sí tiene opciones visibles? entonces aún no está definida.
    var pending = false;
    for (var d = 0; d < c.levels.length; d++) {
      var s = cascElem(d);
      if (s) { var f = closestFld(s); var visible = f && f.style.display !== 'none';
        if (visible && !s.value) { pending = true; break; } }
    }
    var resolved = !pending && matches.length > 0;
    (c.fills || []).forEach(function (fname) {
      var el = cascFillElem(fname); if (!el) return;
      if (resolved) {
        var val = matches[0][fname] || '';
        var same = matches.every(function (m) { return norm(m[fname] || '') === norm(val); });
        el.value = same ? val : '';
      } else { el.value = ''; }
    });

  }
  function initCascade() {
    var c = cascadeLU(); if (!c) return;

    if (s0) { fillOptions(s0, cascDistinct(c, [], 0)); s0.value = ''; }
    for (var d = 1; d < c.levels.length; d++) {
      var sd = cascElem(d); if (sd) { fillOptions(sd, []); showFld(sd, false); }
    }
    (c.fills || []).forEach(function (fname) { var el = cascFillElem(fname); if (el) el.value = ''; });
  }
  function toNum(v) {
    var s = String(v == null ? '' : v).replace(/[^0-9.,\-]/g, '').replace(/,/g, '');
    var n = parseFloat(s); return isNaN(n) ? 0 : n;
  }
  function fieldValue(name) {
    var real = findHeaderByName(name);
    if (!real) return '';
    var el = document.querySelector('#formFields [data-col="' + real + '"]');
    return el ? el.value : '';
  }
  function recalcComputed() {
    var defs = COMPUTED_FIELDS[state.key]; if (!defs) return;
    Object.keys(defs).forEach(function (target) {
      var d = defs[target];
      var real = findHeaderByName(target); if (!real) return;
      var el = document.querySelector('#formFields [data-col="' + real + '"]'); if (!el) return;
      // Concatenación tipo CONCATENAR(D,"/",E,"/",F,"/",G). Vacío si el 1er campo está vacío.
      if (d.op === 'concat') {
        var parts = (d.fields || []).map(function (f) {
          var v = fieldValue(f); return String(v == null ? '' : v).trim();
        });
        if (!parts.length || parts[0] === '') { el.value = ''; return; }
        el.value = parts.join(d.sep || '/');
        return;
      }
      var av = fieldValue(d.a), bv = fieldValue(d.b);
      var res = null;
      if (d.op === 'sum') {          // suma de varios campos (d.fields)
        var vals = (d.fields || []).map(fieldValue);
        var allEmpty = vals.every(function (v) { return String(v == null ? '' : v).trim() === ''; });
        if (allEmpty) { el.value = ''; return; }
        res = vals.reduce(function (a, v) { return a + toNum(v); }, 0);
      } else if (d.op === 'sub') {
        if (String(av).trim() === '' && String(bv).trim() === '') { el.value = ''; return; }
        res = toNum(av) - toNum(bv);
      } else if (d.op === 'add') {
        if (String(av).trim() === '' && String(bv).trim() === '') { el.value = ''; return; }
        res = toNum(av) + toNum(bv);
      } else if (d.op === 'mul') {
        res = toNum(av) * toNum(bv);
      } else if (d.op === 'div') {
        var bnum = toNum(bv);
        if (String(av).trim() === '' || bnum === 0) { el.value = ''; return; }
        res = toNum(av) / bnum;
      }
      if (res === null) { el.value = ''; return; }
      if (d.format === 'percent') el.value = (Math.round(res * 10000) / 100).toFixed(2) + '%';

  // Ajusta Tipo de Cambio según Moneda (USD -> 1.00 bloqueado; otra -> editable).

    if (!curReal || !rateReal) return;
    var curEl = document.querySelector('#formFields [data-col="' + curReal + '"]');
    var rateEl = document.querySelector('#formFields [data-col="' + rateReal + '"]');
    if (!curEl || !rateEl) return;
    var cur = norm(curEl.value || '');
    var fixedVal = null;
    Object.keys(rule.fixed || {}).forEach(function (k) { if (norm(k) === cur) fixedVal = rule.fixed[k]; });
    if (fixedVal !== null) {

  function renderForm() {
    var box = document.getElementById('formFields'); box.innerHTML = '';
    var allow = FORM_FIELDS[state.key];

        var actual = state.headers.filter(function (h) {
          return String(h).trim().toLowerCase() === String(name).trim().toLowerCase();
        })[0];
        if (actual !== undefined) fields.push(actual);
      });
    } else {
      var excl = EXCLUDE_FIELDS[state.key] || [];
      fields = state.headers.filter(function (h) {

    }
    fields.forEach(function (h) {
      var wrap = document.createElement('div'); wrap.className = 'fld';
      var lab = document.createElement('label');
      lab.innerHTML = esc(String(h).trim()) + (isRequiredField(h) ? ' <span style="color:var(--danger)">*</span>' : '');
      wrap.appendChild(lab);
      // --- Cascada de producto: niveles encadenados y campos autocompletados ---
      var cLevel = cascadeLevelIndex(h);
      if (cLevel >= 0) {
        var csel = document.createElement('select');
        csel.setAttribute('data-col', h);
        csel.setAttribute('data-casc-level', cLevel);

        csel.addEventListener('change', function () { onCascadeChange(cLevel); });

      }
      if (isCascadeFill(h)) {

        wrap.appendChild(lsel);
      } else if (cat) {
        var sel = document.createElement('select'); sel.setAttribute('data-col', h);
        var html = '<option value="">— elegir —</option>';
        (cat.options || []).forEach(function (o) { html += '<option>' + esc(o) + '</option>'; });
        html += '<option value="__add__">➕ Agregar nueva…</option>';
        sel.innerHTML = html;
        sel.addEventListener('change', function () {
          onSelectChange(sel, h);
          recalcComputed();
        });
        wrap.appendChild(sel);
      } else {
        var inp = document.createElement('input');
        inp.type = isDateCol(h) ? 'date' : 'text';
        if (isReadonlyField(h)) {
          inp.type = 'text';
          inp.readOnly = true;
          inp.tabIndex = -1;
        }
        inp.setAttribute('data-col', h);   // se envía; el backend ignora las columnas con fórmula
        if (isAutoNumField(h)) inp.value = nextAvailableId(h);
        if (!inp.readOnly) inp.addEventListener('input', recalcComputed);
        wrap.appendChild(inp);
      }
      box.appendChild(wrap);
    });
    // Regla de moneda (Tipo de Cambio según Moneda) + primer cálculo
    var crule = CURRENCY_RULE[state.key];
    if (crule) {
      var curReal = findHeaderByName(crule.currencyField);
      var curEl = curReal && document.querySelector('#formFields [data-col="' + curReal + '"]');
      if (curEl) { curEl.addEventListener('change', applyCurrencyRule); curEl.addEventListener('input', applyCurrencyRule); }
      applyCurrencyRule();
    }
    initCascade();
    recalcComputed();
  }

  function save() {
    var record = {}; var els = document.querySelectorAll('#formFields [data-col]'); var has = false;
    els.forEach(function (i) {
      var v = (i.value || '').trim();
      if (v === '__add__') v = '';
      if (v && i.type === 'date') v = isoToLargo(v);   // 2026-07-14 → 14 julio 2026
      record[i.getAttribute('data-col')] = v;
      if (v) has = true;
    });
    if (!has) { toast('Completá al menos un campo.', 'err'); return; }
    var reqs = REQUIRED_FIELDS[state.key] || [];
    for (var ri = 0; ri < reqs.length; ri++) {
      var rh = findHeaderByName(reqs[ri]);
      if (!rh || !String(record[rh] || '').trim()) { toast('Falta llenar: ' + reqs[ri], 'err'); return; }
    }
    var btn = document.getElementById('saveBtn'); btn.disabled = true; btn.textContent = 'Guardando...';
    api('add', { token: state.token, key: state.key, record: record }).then(function () {
      toast('Registro agregado.', 'ok');
      els.forEach(function (i) { i.value = ''; }); loadArea();
    }).catch(fail).then(function () { btn.disabled = false; btn.textContent = 'Guardar registro'; });
  }

  function fail(err) { toast((err && err.message) || 'Ocurrió un error.', 'err'); }

  function clearForm() {
    renderForm(); // vacía todo y vuelve a sugerir el número disponible
  }

  // ----- Descargar la tabla como CSV -----
  function csvEscape(v) {
    v = String(v == null ? '' : v);
    if (/[",\n\r]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
    return v;
  }
  // Filas que solo se muestran si esta columna tiene contenido (por área).
  var REQUIRE_FILLED = {
    ventas_clientes: 'Nombre/Razón Social'
  };
  function filteredRows() {
    var q = document.getElementById('search').value.trim().toLowerCase();
    var rows = state.rows.filter(passesFilters);
    // Ocultar filas sin la columna requerida del área (p. ej. Clientes sin nombre)
    var reqName = REQUIRE_FILLED[state.key];
    if (reqName) {
      var reqCol = findHeaderByName(reqName);
      if (reqCol) rows = rows.filter(function (r) {
        return String(r[reqCol] == null ? '' : r[reqCol]).trim() !== '';
      });
    }
    if (!q) return rows;
    return rows.filter(function (r) {
      return state.headers.some(function (h) {
        return String(r[h] == null ? '' : r[h]).toLowerCase().indexOf(q) !== -1; });
    });
  }
  function downloadCSV() {
    if (!state.headers.length) { toast('No hay datos para descargar.', 'err'); return; }
    var cols = visibleHeaders();
    var rows = sortRows(filteredRows());
    var lines = [ cols.map(function (h) { return csvEscape(String(h).trim()); }).join(',') ];
    rows.forEach(function (r) {
      lines.push(cols.map(function (h) {
        return csvEscape(isDateCol(h) ? formatDateCell(r[h]) : r[h]);
      }).join(','));
    });
    var csv = '\uFEFF' + lines.join('\r\n'); // BOM para que Excel lea acentos
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var fecha = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = (state.label || 'tabla').trim().replace(/\s+/g, '_') + '_' + fecha + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('pass').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  document.getElementById('togglePass').addEventListener('click', function () {
    var p = document.getElementById('pass');
    var show = p.type === 'password';
    p.type = show ? 'text' : 'password';
    document.getElementById('eyeShow').style.display = show ? 'none' : '';
    document.getElementById('eyeHide').style.display = show ? '' : 'none';
    this.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
    p.focus();
  });
  document.getElementById('logoutBtn').addEventListener('click', doLogout);
  document.getElementById('menuBtn').addEventListener('click', toggleNav);
  document.getElementById('closeBtn').addEventListener('click', closeNav);
  document.getElementById('backdrop').addEventListener('click', closeNav);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeNav(); });
  document.getElementById('search').addEventListener('input', renderTable);
  document.getElementById('refreshBtn').addEventListener('click', function () {
    if (state.key === 'dashboard') loadDashboard();
    else if (state.key === 'inicio') loadHome();
    else loadArea();
  });
  document.getElementById('downloadBtn').addEventListener('click', downloadCSV);
  document.getElementById('filterBtn').addEventListener('click', openFilterPopup);
  document.getElementById('filterBar').addEventListener('click', function (e) {
    var t = e.target;
    if (t.classList && t.classList.contains('x')) {
      filters.splice(parseInt(t.getAttribute('data-i'), 10), 1);
      renderFilterBar(); renderTable();
    } else if (t.id === 'clearFiltersBtn') {
      filters = []; renderFilterBar(); renderTable();
    }
  });
  document.getElementById('tableWrap').addEventListener('click', function (e) {
    var t = e.target;
    var th = t.closest ? t.closest('th.sortable') : null;
    if (th) {
      var col = th.getAttribute('data-col');
      if (sortState.col === col) sortState.dir = -sortState.dir;
      else { sortState.col = col; sortState.dir = 1; }
      editingRow = -1; renderTable(); return;
    }
    if (t.classList && t.classList.contains('edit-btn')) {
      editingRow = parseInt(t.getAttribute('data-row'), 10); renderTable();
    } else if (t.classList && t.classList.contains('cancel-btn')) {
      editingRow = -1; renderTable();
    } else if (t.classList && t.classList.contains('save-btn')) {
      saveEdit(parseInt(t.getAttribute('data-row'), 10), t);
    }
  });
  document.getElementById('saveBtn').addEventListener('click', save);
  document.getElementById('clearBtn').addEventListener('click', clearForm);
  document.getElementById('user').focus();
</script>
</body>
</html>
