  // Campos obligatorios por área (por nombre; tolera espacios/acentos/mayúsculas).
  var PEND_REQ = ['Pendiente','Cliente','Responsable','Prioridad','Status'];
  var REQUIRED_FIELDS = {
    pend_abiertos: PEND_REQ, pend_norev: PEND_REQ, pend_todos: PEND_REQ, pend_cerrados: PEND_REQ,
    recurrentes: ['Pendiente','Frecuencia','Regla']
  };
  // Estatus que cuentan como pendiente cerrado (debe coincidir con lib/core.js)
  var CERRADOS = ['cancelado'];
  function frontCerrado(v){ var s=norm(v); return s.indexOf('terminado')===0 || CERRADOS.indexOf(s)!==-1; }
  // Campos que se autocompletan con el siguiente número disponible (editables).
  // Cálculo automático: al capturar la base se llenan IVA y Total. Por área.
  var AUTO_CALC = {};
  var SELECT_OPTIONS = { recurrentes: { 'Activo':['TRUE','FALSE'], 'Frecuencia':['Mensual','Quincenal','Semanal','Bimestral'] } };
  function selectOptionsFor(h) {
    var map = SELECT_OPTIONS[state.key];
    if (map) { for (var k in map) { if (norm(k)===norm(h)) return map[k]; } }
    if (state.key==='recurrentes' && norm(h)===norm('Cliente')) {
      var base = (state.categories && state.categories['Cliente']) || [];
      return ['TODOS'].concat(base);
    }
    return null;
  }
  var MULTI_RESP = ['Responsable'];
  function esMultiResp(h) { return MULTI_RESP.some(function(m){return norm(m)===norm(h);}); }
  function campoForm(nombre) {
    var els = document.querySelectorAll('#formFields [data-col]');
    for (var i = 0; i < els.length; i++) {
      if (norm(els[i].getAttribute('data-col')) === norm(nombre)) return els[i];
    }
    return null;
  }
  function recalcularTotales() {
    var cfg = AUTO_CALC[state.key];
    if (!cfg) return;
    var elBase = campoForm(cfg.base), elIva = campoForm(cfg.iva), elTotal = campoForm(cfg.total);
    if (!elBase || !elIva || !elTotal) return;
    var sub = parseNumber(elBase.value);
    if (sub === null) { elIva.value = ''; elTotal.value = ''; return; }
    var total = Math.round(sub * (1 + cfg.tasa) * 100) / 100;
    var iva = Math.round((total - sub) * 100) / 100;   // así Subtotal + IVA = Total exacto
    elTotal.value = formatMoney(total);
    elIva.value = formatMoney(iva);
  }

  // Subtítulo corto por área (encabezado de página)
  var AREA_SUBTITULOS = {
    pend_abiertos: 'Pendientes en curso',
    pend_norev: 'Terminados que faltan por revisar',
    pend_todos: 'Todos los pendientes registrados',
    pend_cerrados: 'Pendientes terminados o cancelados',
    recurrentes: 'Plantillas que se convierten en pendientes cada periodo'
  };

  var AUTONUM_FIELDS = [];
  function findHeaderByName(name) {
    var key = norm(name);
    return state.headers.filter(function (h) { return norm(h) === key; })[0];
  }
  function isRequiredField(h) {
    return (REQUIRED_FIELDS[state.key] || []).some(function (r) { return norm(r) === norm(h); });
  }
  function isAutoNumField(h) {
    return AUTONUM_FIELDS.some(function (a) { return norm(a) === norm(h); });
  }
  function nextAvailableId(h) {
    var used = {};
    // Usa los IDs de toda la hoja (los manda /api/data), no solo los de la vista filtrada
    var lista = (state.idsUsados && state.idsUsados.length)
      ? state.idsUsados
      : state.rows.map(function (r) { return r[h]; });
    lista.forEach(function (x) {
      var v = parseInt(String(x == null ? '' : x).trim(), 10);
      if (!isNaN(v) && v > 0) used[v] = true;
    });
    var n = 1; while (used[n]) n++; return String(n);
  }
  function isLookupKeyField(h) {
    return !!(state.lookup && norm(state.lookup.keyField) === norm(h));
  }
  function applyLookup(value) {
    if (!state.lookup) return;
    var rec = state.lookup.map[value] || {};
    state.lookup.fills.forEach(function (f) {
      var real = findHeaderByName(f);
      if (!real) return;
      var el = document.querySelector('#formFields [data-col="' + real + '"]');
      if (el) el.value = rec[f] || '';
    });
  }
  function renderForm() {
    var box = document.getElementById('formFields'); box.innerHTML = '';
    var allow = FORM_FIELDS[state.key];
    var fields;
    if (allow && allow.length) {
      fields = [];
      allow.forEach(function (name) {
        var actual = state.headers.filter(function (h) {
          return String(h).trim().toLowerCase() === String(name).trim().toLowerCase();
        })[0];
        if (actual !== undefined && !esCampoAuto(actual)) fields.push(actual);
      });
    } else {
      var excl = EXCLUDE_FIELDS[state.key] || [];
      fields = state.headers.filter(function (h) {
        return !excl.some(function (e) { return norm(e) === norm(h); });
      });
    }
    fields.forEach(function (h) {
      var wrap = document.createElement('div'); wrap.className = 'fld';
      var lab = document.createElement('label');
      lab.innerHTML = esc(String(h).trim()) + (isRequiredField(h) ? ' <span style="color:var(--danger)">*</span>' : '');
      wrap.appendChild(lab);
      var cat = isReadonlyField(h) ? null : categoryFor(h);  // solo lectura gana sobre desplegable
      var sopts = selectOptionsFor(h);
      if (sopts) {
        var ssel = document.createElement('select'); ssel.setAttribute('data-col', h);
        ssel.innerHTML = '<option value="">— elegir —</option>' + sopts.map(function(o){return '<option>'+esc(o)+'</option>';}).join('');
        wrap.appendChild(ssel); box.appendChild(wrap); return;
      }
      if (esMultiResp(h)) {
        var opciones = (categoryFor(h) || {}).options || state.colaboradores || [];
        var hid = document.createElement('input'); hid.type='hidden'; hid.setAttribute('data-col', h); hid.value='';
        var cont = document.createElement('div'); cont.className='multi-chk';
        opciones.forEach(function (op) {
          var lb = document.createElement('label'); lb.className='mc-item';
          var cb = document.createElement('input'); cb.type='checkbox'; cb.value=op;
          cb.addEventListener('change', function () {
            var sel = Array.prototype.filter.call(cont.querySelectorAll('input[type=checkbox]'), function(x){return x.checked;})
              .map(function(x){return x.value;});
            hid.value = sel.join(', ');
          });
          var sp = document.createElement('span'); sp.textContent = primerNombre(op);
          lb.appendChild(cb); lb.appendChild(sp); cont.appendChild(lb);
        });
        wrap.appendChild(hid); wrap.appendChild(cont);
        box.appendChild(wrap); return;
      }
      if (isLookupKeyField(h)) {
        var lsel = document.createElement('select'); lsel.setAttribute('data-col', h);
        var lhtml = '<option value="">— elegir —</option>';
        state.lookup.options.forEach(function (o) { lhtml += '<option>' + esc(o) + '</option>'; });
        lsel.innerHTML = lhtml;
        lsel.addEventListener('change', function () { applyLookup(lsel.value); });
        wrap.appendChild(lsel);
      } else if (cat) {
        var sel = document.createElement('select'); sel.setAttribute('data-col', h);
        var html = '<option value="">— elegir —</option>';
        (cat.options || []).forEach(function (o) { html += '<option>' + esc(o) + '</option>'; });
        html += '<option value="__add__">➕ Agregar nueva…</option>';
        sel.innerHTML = html;
        sel.addEventListener('change', function () {
          onSelectChange(sel, h);
          if (isLookupKeyField(h)) applyLookup(sel.value);
        });
        wrap.appendChild(sel);
      } else {
        var inp = document.createElement('input');
        inp.type = isDateCol(h) ? 'date' : 'text';
        if (isReadonlyField(h)) {
          inp.type = 'text';
          inp.readOnly = true;
          inp.tabIndex = -1;
        }
        inp.setAttribute('data-col', h);   // se envía; el backend ignora las columnas con fórmula
        if (isAutoNumField(h)) inp.value = nextAvailableId(h);
        if (isMoneyCol(h) && !isReadonlyField(h)) {
          inp.setAttribute('inputmode', 'decimal');
          var cfgAC = AUTO_CALC[state.key];
          var esBase = !!(cfgAC && norm(h) === norm(cfgAC.base));
          // Al salir: mostrar formateado. Al entrar: mostrar el número crudo para editar.
          inp.addEventListener('blur', function () {
            var n = parseNumber(inp.value);
            inp.value = (n === null) ? '' : formatMoney(n);
            if (esBase) recalcularTotales();
          });
          inp.addEventListener('focus', function () {
            var n = parseNumber(inp.value);
            inp.value = (n === null) ? '' : String(n);
          });
          if (esBase) inp.addEventListener('input', recalcularTotales);
        }
        wrap.appendChild(inp);
      }
      box.appendChild(wrap);
    });
  }

  function fillForm(rec) {
    var els = document.querySelectorAll('#formFields [data-col]');
    els.forEach(function (el) {
      var h = el.getAttribute('data-col');
      var val = (rec[h] != null) ? String(rec[h]) : '';
      if (el.type === 'hidden') {
        el.value = val;
        var cont = el.parentNode.querySelector('.multi-chk');
        if (cont) {
          var want = val.split(/[;,\n]/).map(function(x){ return norm(x.trim()); });
          cont.querySelectorAll('input[type=checkbox]').forEach(function(cb){ cb.checked = want.indexOf(norm(cb.value))!==-1; });
        }
      } else if (el.tagName === 'SELECT') {
        var has = Array.prototype.some.call(el.options, function(o){ return norm(o.value||o.textContent)===norm(val); });
        if (!has && val) { var o=document.createElement('option'); o.textContent=val; el.appendChild(o); }
        el.value = val;
      } else if (el.type === 'date') {
        el.value = val ? largoToIso(val) : '';
      } else { el.value = val; }
    });
  }
  function abrirEditar(rowNum) {
    var rec = state.rows.filter(function (r){ return r._row === rowNum; })[0]; if (!rec) return;
    state.editRow = rowNum;
    document.getElementById('addModalTitle').textContent = 'Editar registro';
    document.getElementById('saveBtn').textContent = 'Guardar cambios';
    renderForm(); fillForm(rec);
    var m = document.getElementById('addModal'); if (m) m.classList.add('open');
  }
  function save() {
    var record = {}; var els = document.querySelectorAll('#formFields [data-col]'); var has = false;
    els.forEach(function (i) {
      var v = (i.value || '').trim();
      if (v === '__add__') v = '';
      if (v && i.type === 'date') v = isoToLargo(v);   // 2026-07-14 → 14 julio 2026
      var colName = i.getAttribute('data-col');
      if (v && isMoneyCol(colName)) { var n = parseNumber(v); if (n !== null) v = String(n); }
      record[colName] = v;
      if (v) has = true;
    });
    if (!has) { toast('Completa al menos un campo.', 'err'); return; }
    // Auto: responsable de solicitud = usuario; fecha de solicitud = hoy
    state.headers.forEach(function (h) {
      if (AUTO_SOLICITANTE.some(function(a){return norm(a)===norm(h);})) record[h] = state.nombre || '';
      if (AUTO_HOY.some(function(a){return norm(a)===norm(h);})) record[h] = isoToLargo(isoHoy());
    });
    has = true;
    var reqs = REQUIRED_FIELDS[state.key] || [];
    for (var ri = 0; ri < reqs.length; ri++) {
      var rh = findHeaderByName(reqs[ri]);
      if (!rh || !String(record[rh] || '').trim()) { toast('Falta llenar: ' + reqs[ri], 'err'); return; }
    }
    var btn = document.getElementById('saveBtn'); btn.disabled = true; btn.textContent = 'Guardando...';
    var editando = state.editRow;
    var llamada = editando
      ? api('update', { token: state.token, key: state.key, row: editando, record: record })
      : api('add', { token: state.token, key: state.key, record: record });
    llamada.then(function () {
      toast(editando ? 'Cambios guardados.' : 'Registro agregado.', 'ok');
      state.editRow = null;
      els.forEach(function (i) { i.value = ''; }); closeAddModal(); loadArea();
    }).catch(fail).then(function () { btn.disabled = false; btn.textContent = editando ? 'Guardar cambios' : 'Guardar registro'; });
  }

  function fail(err) { toast((err && err.message) || 'Ocurrió un error.', 'err'); }

  function clearForm() {
    renderForm(); // vacía todo y vuelve a sugerir el número disponible
  }

  // ----- Descargar como PDF (vía diálogo de impresión del navegador) -----
  function downloadPDF() {
    if (!state.headers.length) { toast('No hay datos para descargar.', 'err'); return; }
    var cols = visibleHeaders();
    var rows = sortRows(filteredRows());

    // Encabezado: título, fecha y filtros aplicados
    var d = new Date();
    var meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
                 'septiembre','octubre','noviembre','diciembre'];
    var fechaTxt = d.getDate() + ' de ' + meses[d.getMonth()] + ' de ' + d.getFullYear();

    var filtrosTxt = '';
    if (filters.length) {
      filtrosTxt = filters.map(function (f) {
        var desc = (f.type === 'values')
          ? f.values.join(', ')
          : ((f.from ? isoToLargo(f.from) : '…') + ' a ' + (f.to ? isoToLargo(f.to) : '…'));
        return String(f.col).trim() + ': ' + desc;
      }).join('  ·  ');
    }
    var busq = document.getElementById('search').value.trim();
    if (busq) filtrosTxt += (filtrosTxt ? '  ·  ' : '') + 'Búsqueda: ' + busq;

    // Tarjetas de resumen (se copian tal cual se ven en pantalla)
    var resumenHtml = '';
    var cards = document.querySelectorAll('#summary .sum-card');
    if (cards.length) {
      resumenHtml = '<div class="pdf-cards">';
      cards.forEach(function (c) {
        var k = c.querySelector('.k'), v = c.querySelector('.v');
        resumenHtml += '<div class="pdf-card"><span class="pk">' +
          esc(k ? k.textContent : '') + '</span><span class="pv">' +
          esc(v ? v.textContent : '') + '</span></div>';
      });
      resumenHtml += '</div>';
    }

    // Tabla
    var thead = '<tr>' + cols.map(function (h) {
      return '<th>' + esc(String(h).trim()) + '</th>';
    }).join('') + '</tr>';

    var tbody = rows.map(function (r) {
      return '<tr>' + cols.map(function (h) {
        var val = r[h];
        if (isDateCol(h)) val = formatDateCell(val);
        else if (isMoneyCol(h)) { var n = parseNumber(val); val = (n === null) ? '' : formatMoney(n); }
        var cls = isMoneyCol(h) ? ' class="r"' : (isCenterCol(h) ? ' class="c"' : '');
        return '<td' + cls + '>' + esc(val) + '</td>';
      }).join('') + '</tr>';
    }).join('');

    var titulo = (state.label || 'Registros');
    var html = '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">' +
      '<title>' + esc(titulo) + ' — ' + esc(fechaTxt) + '</title><style>' +
      '@page { size: landscape; margin: 12mm; }' +
      'body { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; color:#15181d; margin:0; }' +
      'h1 { font-size:18px; margin:0 0 2px; }' +
      '.sub { font-size:11px; color:#6b7280; margin-bottom:10px; }' +
      '.filtros { font-size:10px; color:#6b7280; margin-bottom:10px; }' +
      '.pdf-cards { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }' +
      '.pdf-card { border:1px solid #e5e7eb; border-radius:6px; padding:6px 10px; min-width:110px; }' +
      '.pdf-card .pk { display:block; font-size:8px; text-transform:uppercase; letter-spacing:.5px; color:#6b7280; }' +
      '.pdf-card .pv { display:block; font-size:13px; font-weight:600; }' +
      'table { width:100%; border-collapse:collapse; font-size:8.5px; table-layout:auto; }' +
      'th, td { border:1px solid #e5e7eb; padding:4px 5px; text-align:left; word-break:break-word; }' +
      'th { background:#f3f4f6; font-weight:600; text-align:center; font-size:8px; text-transform:uppercase; }' +
      'td.r { text-align:right; white-space:nowrap; } td.c { text-align:center; }' +
      'tr { page-break-inside:avoid; } thead { display:table-header-group; }' +
      '.pie { margin-top:10px; font-size:9px; color:#6b7280; }' +
      '</style></head><body>' +
      '<h1>' + esc(titulo) + '</h1>' +
      '<div class="sub">Grupo CFA · ' + esc(fechaTxt) + ' · ' +
        rows.length.toLocaleString('es-MX') + ' registros</div>' +
      (filtrosTxt ? '<div class="filtros">Filtros aplicados — ' + esc(filtrosTxt) + '</div>' : '') +
      resumenHtml +
      '<table><thead>' + thead + '</thead><tbody>' + tbody + '</tbody></table>' +
      '<div class="pie">Generado desde el panel de pendientes de Grupo CFA.</div>' +
      '</body></html>';

    var w = window.open('', '_blank');
    if (!w) { toast('Permite las ventanas emergentes para generar el PDF.', 'err'); return; }
    w.document.open(); w.document.write(html); w.document.close();
    w.onload = function () { w.focus(); w.print(); };
    // Respaldo por si onload no dispara
    setTimeout(function () { try { w.focus(); w.print(); } catch (e) {} }, 600);
  }

  // ----- Menú para elegir formato de descarga -----
  function toggleDownloadMenu() {
    var prev = document.getElementById('dlMenu');
    if (prev) { prev.remove(); return; }
    var btn = document.getElementById('downloadBtn');
    var m = document.createElement('div');
    m.className = 'dl-menu'; m.id = 'dlMenu';
    m.innerHTML = '<button type="button" data-f="csv">Descargar CSV</button>' +
                  '<button type="button" data-f="pdf">Descargar PDF</button>';
    btn.parentNode.style.position = 'relative';
    btn.parentNode.appendChild(m);
    m.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () {
        var f = b.getAttribute('data-f');
        m.remove();
        if (f === 'csv') downloadCSV(); else downloadPDF();
      });
    });
    setTimeout(function () {
      document.addEventListener('click', function cerrar(e) {
        if (!m.contains(e.target) && e.target !== btn) { m.remove(); document.removeEventListener('click', cerrar); }
      });
    }, 0);
  }

  function csvEscape(v) {
    v = String(v == null ? '' : v);
    if (/[",\n\r]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
    return v;
  }
  function filteredRows() {
    var q = document.getElementById('search').value.trim().toLowerCase();
    var rows = state.rows.filter(passesFilters).filter(pasaQuick);
    if (!q) return rows;
    return rows.filter(function (r) {
      return state.headers.some(function (h) {
        return String(r[h] == null ? '' : r[h]).toLowerCase().indexOf(q) !== -1; });
    });
  }
  function downloadCSV() {
    if (!state.headers.length) { toast('No hay datos para descargar.', 'err'); return; }
    var cols = visibleHeaders();
    var rows = sortRows(filteredRows());
    var lines = [ cols.map(function (h) { return csvEscape(String(h).trim()); }).join(',') ];
    rows.forEach(function (r) {
      lines.push(cols.map(function (h) {
        return csvEscape(isDateCol(h) ? formatDateCell(r[h]) : r[h]);
      }).join(','));
    });
    var csv = '\uFEFF' + lines.join('\r\n'); // BOM para que Excel lea acentos
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var fecha = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = (state.label || 'tabla').trim().replace(/\s+/g, '_') + '_' + fecha + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('pass').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  document.getElementById('togglePass').addEventListener('click', function () {
    var p = document.getElementById('pass');
    var show = p.type === 'password';
    p.type = show ? 'text' : 'password';
    document.getElementById('eyeShow').style.display = show ? 'none' : '';
    document.getElementById('eyeHide').style.display = show ? '' : 'none';
    this.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
    p.focus();
  });
  document.getElementById('logoutBtn').addEventListener('click', doLogout);
  var logoutRail = document.getElementById('logoutRail');
  if (logoutRail) logoutRail.addEventListener('click', doLogout);
  document.getElementById('menuBtn').addEventListener('click', toggleNav);
  document.getElementById('closeBtn').addEventListener('click', closeNav);
  document.getElementById('backdrop').addEventListener('click', closeNav);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeNav(); });
  document.getElementById('search').addEventListener('input', renderTable);
  document.getElementById('refreshBtn').addEventListener('click', function () {
    if (state.key === 'dashboard') loadDashboard();
    else if (state.key === 'inicio') loadHome();
    else loadArea();
  });
  document.getElementById('downloadBtn').addEventListener('click', toggleDownloadMenu);
  document.getElementById('filterBtn').addEventListener('click', openFilterPopup);
  document.getElementById('filterBar').addEventListener('click', function (e) {
    var t = e.target;
    if (t.classList && t.classList.contains('x')) {
      filters.splice(parseInt(t.getAttribute('data-i'), 10), 1);
      renderFilterBar(); renderTable();
    } else if (t.id === 'clearFiltersBtn') {
      filters = []; renderFilterBar(); renderTable();
    }
  });
  document.getElementById('tableWrap').addEventListener('click', function (e) {
    var t = e.target;
    var th = t.closest ? t.closest('th.sortable') : null;
    if (th) {
      var col = th.getAttribute('data-col');
      if (sortState.col === col) sortState.dir = -sortState.dir;
      else { sortState.col = col; sortState.dir = 1; }
      editingRow = -1; renderTable(); return;
    }
    if (t.classList && t.classList.contains('edit-btn')) {
      var rn = parseInt(t.getAttribute('data-row'), 10);
      if (state.key === 'recurrentes') { abrirEditar(rn); return; }
      editingRow = rn; renderTable();
    } else if (t.classList && t.classList.contains('cancel-btn')) {
      editingRow = -1; renderTable();
    } else if (t.classList && t.classList.contains('save-btn')) {
      saveEdit(parseInt(t.getAttribute('data-row'), 10), t);
    }
  });
  document.getElementById('tableWrap').addEventListener('change', function (e) {
    var s = e.target;
    if (s.tagName === 'SELECT' && s.classList.contains('row-input') && s.value === '__add__') {
      onSelectChange(s, s.getAttribute('data-col'));
    }
  });
  function openAddModal() {
    state.editRow = null;
    document.getElementById('addModalTitle').textContent = 'Agregar registro';
    document.getElementById('saveBtn').textContent = 'Guardar registro';
    renderForm();
    var m = document.getElementById('addModal');
    if (m) m.classList.add('open');
  }
  function closeAddModal() {
    state.editRow = null;
    var m = document.getElementById('addModal');
    if (m) m.classList.remove('open');
  }
  document.getElementById('openAddBtn').addEventListener('click', openAddModal);
  document.getElementById('closeAddBtn').addEventListener('click', closeAddModal);
  document.getElementById('openTimeBtn').addEventListener('click', function(){ abrirModalTiempo(); });
  document.getElementById('openGenBtn').addEventListener('click', abrirGenerar);
  document.getElementById('closeGenBtn').addEventListener('click', cerrarGenerar);
  document.getElementById('genCancel').addEventListener('click', cerrarGenerar);
  document.getElementById('genConfirm').addEventListener('click', confirmarGenerar);
  document.getElementById('genModal').addEventListener('click', function(e){ if(e.target===this) cerrarGenerar(); });
  document.getElementById('closeTimeBtn').addEventListener('click', cerrarModalTiempo);
  document.getElementById('tlSave').addEventListener('click', guardarTiempo);
  document.getElementById('tlClear').addEventListener('click', function(){ tlActividades=[{actividad:'',horas:''}]; pintarActividades(); });
  document.getElementById('tlAddRow').addEventListener('click', function(){ tlActividades.push({actividad:'',horas:''}); pintarActividades(); });
  document.getElementById('timeModal').addEventListener('click', function(e){ if(e.target===this) cerrarModalTiempo(); });
  document.getElementById('addModal').addEventListener('click', function (e) {
    if (e.target === this) closeAddModal();   // clic fuera de la tarjeta cierra
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeAddModal(); cerrarModalTiempo(); cerrarGenerar(); }
  });
  document.getElementById('saveBtn').addEventListener('click', save);
  document.getElementById('clearBtn').addEventListener('click', clearForm);
  document.getElementById('user').focus();
</script>
